aptism, Eucharist and Ministry (World Council of Churches, Faith and Order Paper No. 111, 1982), as cited by the author.", "share": "Share the link", "initiative": "Koinonia: Unity and Justice Initiative", "author_name": "Michael Manzano Bantolin"}, "zh": {"review_notice": "本文於發表前，已由 Magisterium AI 審閱。", "review_small": "此為 AI 輔助的審閱，並非教會官方的認可，也不是准印（imprimatur）。", "translation_note": "上述審閱針對英文原文；中文譯本由 AI 翻譯，未另經審閱，有待母語人士校對。", "illustration_credit": "插圖以 AI 圖像生成製作。", "purpose": "福傳用，非商業用途。", "by": "作者", "language": "語言", "abstract": "摘要", "keywords": "關鍵詞", "contents": "目錄", "cited_label": "BEM 1982", "references_note": "註釋與參考資料保留英文原文。", "references": "參考資料", "footnotes": "註釋", "back_to_top": "回到頂端", "read_full": "以中文或英文閱讀全文", "swipe": "滑動", "alt_00": "一個圓形麵包在亞麻布上擘成兩半，金色的光從兩半之間流瀉而出。", "alt_01": "一名嬰兒在石製聖洗池旁領洗，水從貝殼中傾注而下，父母和代父母緊緊圍在身旁。", "alt_02": "來自不同傳統的基督徒一同站在同一個聖洗池周圍。", "alt_03": "在菲律賓鄉間的一戶村舍裡，一位祖母和孩子一起讀著打開的聖經。", "alt_04": "寧靜的聖堂中，讀經台上放著一本打開的聖經，後方是沐浴在光中的簡樸祭台。", "alt_05": "一隻由光形成的鴿子，在聚集祈禱的團體上方。", "alt_06": "一位探訪者握著一位臥病在床的年長婦人的手，身旁有一支蠟燭和一個小苦像。", "alt_07": "來自數個不同傳統的基督徒一同為窮人送上餐食。", "alt_08": "堂區團體的成員聚集在聖堂門口，各自獻上不同的恩賜與服務。", "alt_09": "黃昏時分的一張長桌，來自不同傳統的人們在交談，仍有幾張椅子空著。", "alt_10": "黎明時分，許多條小路匯聚到山丘上的一座小聖堂。", "bem_note": "標示 BEM 的段落，引自普世教會協會《洗禮、聖餐與職事》（信仰與教制委員會第 111 號文件，1982）；中文依本文英文譯出，並非官方譯本。", "share": "分享連結", "initiative": "共融：合一與正義倡議（Koinonia: Unity and Justice Initiative）", "author_name": "Michael Manzano Bantolin"}}, "text": {"en": {"s003": "Sacramental Ecumenism is one of the few ecumenical movements happening in our world today. In the aftermath of World War I, the Churches started coming together to dialogue and address the issues that had occurred. It was the start of Churches realizing the need to aim for unity. Some Protestant Churches and other Orthodox Churches gathered to form the World Council of Churches in 1948. In 1982, the member churches of the WCC, through the Faith and Order Commission, issued the document Baptism, Eucharist and Ministry (BEM). BEM became a guiding factor in the ecumenical journey of the WCC. BEM is not a catholic magisterial teaching but is worthy of significance in the ecumenical dialogue of Churches. The Catholic Church is not a member of the World Council of Churches. On the course of time, the Catholic Church did not remain isolated but opened itself to the call for renewal and the realization of being open to ecumenism. The Second Vatican Council was convened, and the popes promoted ecumenical dialogues with other Churches.", "s005": "Sacramental Ecumenism, BEM, sacrament, baptism, Eucharist, ministry", "s011": "On Sacramental Ecumenism: Encountering Christ in the Broken Bread of Christian Unity", "s015": "Introduction", "s017": "Baptism establishes a real sacramental bond, although communion with the Catholic Church can remain imperfect.[1] The Eucharist makes the Church.[2] Eastern Churches that have preserved apostolic succession, valid Holy Orders, and a valid Eucharist are true particular Churches even without full communion with Rome.[3] We are in fact closer to unity than we think - or even dare to acknowledge.[4] We pray that our common baptism and the action of the Holy Spirit in this Eucharist will draw us closer to one another and begin to dispel the sad divisions that separate us.[5]", "s019": "The Church as sacrament is nothing in itself but everything in Christ, who himself is the true Lumen Gentium.[6] The Eucharist binds us into one Body by strengthening our unity. This means that the offering of Christ is made in every Eucharist. In the Eucharist, Christ gives us His humanity to be our nourishment.[7] The liturgy is celebrated by God's holy people with their bishop. In a valid celebration of the Eucharist, Christ’s one sacrifice is made sacramentally present through the consecration of bread and wine by a validly ordained bishop or priest. The bishop's chair is the Church's signature sign of the unity of the Church.[8] Full Eucharistic communion remains a future, if hopefully not too distant, goal.[9] Such fellowship would also presuppose solutions to the problems and open questions that pertain to the theology of the ministry.[10]", "s021": "Methodology", "s023": "This study employs a qualitative theological methodology that combines documentary analysis (of the BEM document), comparative theology, and ecclesial reflection. It examines key sacramental sources- such as Lumen Gentium, Sacrosanctum Concilium, the Catechism, papal teachings, and ecumenical guidelines- to identify core principles of Baptism, Eucharist, and ministry as foundations for Christian unity. Through comparative analysis, Catholic teaching is placed in dialogue with Orthodox and Protestant sacramental perspectives to highlight convergences and remaining tensions. The research employs a hermeneutic of communion, interpreting the sacraments as expressions of the Church’s vocation to unity. This approach allows the study to assess sacramental ecumenism as both doctrinal convergence and lived ecclesial practice.", "s025": "God's saving purpose is to unite all things and people in Christ.[11] The Lord Jesus, before ascending into heaven, commanded his disciples to proclaim the Gospel to the whole world and to baptize all nations: “Go into the whole world and proclaim the Good News.[12] The disagreement between Catholics and Protestants over the number of sacraments can be solved only by (re-) establishing a consensus between Christian communions about the Church itself as sacrament, within which the sacraments might then be rehabilitated.[13] Sacramental ecumenism is therefore not a reduction of doctrine but a rediscovery of the Church’s very nature as sign and instrument of reconciliation.[14]", "s027": "In the Catholic understanding, valid Eucharistic celebration presupposes valid Holy Orders. Eastern Churches preserving apostolic succession and a valid Eucharist are to be distinguished from ecclesial communities lacking the sacrament of Orders.[15] The pain of separation is itself a grace, a call to deeper conversion, humility, and dialogue.[16] The Church’s longing for Eucharistic unity is not nostalgia but hope for the fullness of communion that awaits us.[17] Christ’s prayer, ‘that they may all be one,’ resounds in every Eucharistic celebration, calling the Church to visible unity (Jn. 17:21). The future of Christian unity is Eucharistic, not because it is distant, but because it is already a hidden force at work among all who long and labor for communion.[18]", "s029": "The World Council of Churches published an ecumenical document called Baptism, Eucharist, and Ministry in 1982 as a guide for member Churches in their approach to the essential life of the Church, such as the sacrament of baptism, the Eucharist, and the ministry of the Church. The document offers important ecumenical perspectives. Here are the important insights from BEM:", "s031": "BAPTISM, EUCHARIST, AND MINISTRY (1982)", "s033": "The World Council of Churches is “a fellowship of churches which confess the Lord Jesus Christ as God and Saviour according to the scriptures and therefore seek to fulfil together their common calling to the glory of the one God, Father, Son and Holy Spirit” (Constitution).[19] The council strived to live out its calling as a fellowship of Churches from different traditions and denominational identities. From the time it was convened and formed as a council, it did its best to integrate into its institution the precepts of the prayer of Christ, “that all may be one,” (John 17: 21).", "s035": "ON BAPTISM", "s037": "Christian baptism is rooted in the ministry of Jesus of Nazareth, in his death and in his resurrection. It is in corporation into Christ, who is the crucified and risen Lord; it is entry into the New Covenant between God and God’s people. Baptism is a gift of God, and is administered in the name of the Father, the Son, and the Holy Spirit.[20]", "s039": "Christian Baptism is the first sacrament of initiation. This sacrament opens believers to receive the grace to be sons and daughters of God and to be partakers of the Kingdom of God.", "s041": "The institution of Baptism as the first sacrament of initiation and it is the gateway to other sacraments. Christian baptism is rooted in the ministry of Jesus of Nazareth, in his death and in his resurrection. It is incorporation into Christ, the crucified and risen Lord; it is entry into the New Covenant between God and God’s people. Baptism is a gift of God, and is administered in the name of the Father, the Son, and the Holy Spirit. St Matthew records that the risen Lord, when sending his disciples into the world, commanded them to baptize (Matt. 28:18–20). The universal practice of baptism by the apostolic Church from its earliest days is attested in letters of the New Testament, the Acts of the Apostles, and the writings of the Fathers. The churches today continue this practice as a rite of commitment to the Lord who bestows his grace upon his people.[21]", "s043": "Baptism is the beginning of the Christian journey and the foundation of our identity as members of Christ and His Church. Through water and the Holy Trinity, we are incorporated into the death and resurrection of Christ and welcomed into the New Covenant. As a gift of God, Baptism unites Christians across different traditions through the common calling to follow Christ and live according to His grace. The Churches are therefore called to recognize Baptism not only as an initiation into Christian life but also as a profound source of communion, reminding us that those who are baptized belong to one Lord and are called to witness together to the Gospel.", "s045": "The Church administers the Sacrament of Baptism to all who call upon Christ and to those who wish their children to be called Christians. It is the gate to upholding a life dedicated to Christ and His Church. It is an identity to be called to follow Christ and practice virtues according to the examples of Christ Himself.[22]", "s047": "The Sacrament of Baptism opens the newly baptized to Christians to grace and the wellspring of Salvation. It is in this sacrament that an individual receives their identity as sons and daughters of God the Father and inheritors of the Kingdom of God – a full member of the family of God, the Church. It is in this initiation that we who are baptized in the name of the Holy Trinity become brothers and sisters in Christ and partakers of the threefold gifts of Christ – Priestly, prophetic, and kingly mission.", "s049": "Baptism is the sign of new life through Jesus Christ. It unites the one baptized with Christ and with his people. The New Testament scriptures and the liturgy of the Church unfold the meaning of baptism in various images which express the riches of Christ and the gifts of his salvation. These images are sometimes linked with the symbolic uses of water in the Old Testament. Baptism is participation in Christ’s death and resurrection (Rom. 6:3–5; Col. 2:12); a washing away of sin (I Cor. 6:11); a new birth (John3:5); an enlightenment by Christ (Eph. 5:14); a re- clothing in Christ (Gal. 3:27); a renewal by the Spirit(Titus 3:5); the experience of salvation from the flood(I Peter 3:20–21); an exodus from bondage (I Cor. 10:1–2) and a liberation into a new humanity in which barriers of division whether of sex or race or social status are transcended (Gal. 3:27-28; I Cor. 12:13). The images are many but the reality is one.[23]", "s051": "Through Baptism, we died with Christ. We receive a new humanity according to the promises made by Christ. We are being united with His Body, the Church, partakers of the Kingdom, messengers of the Good News, and instructors of everything good that comes from God. We are a new creation in Christ, destined to live with Christ forever together with our brothers and sisters from every race and tongue, cultures, and nations.", "s053": "Baptism means participating in the life, death, and resurrection of Jesus Christ. Jesus went down into the river Jordan and was baptized in solidarity with sinners to fulfil all righteousness (Matt. 3:15). This baptism set Jesus on the way of the Suffering Servant, as made manifest in his sufferings, death, and resurrection (Mark 10:38–40, 45). By baptism, Christians are immersed in the liberating death of Christ, where their sins are buried, where the “old Adam” is crucified with Christ, and where the power of sin is broken. Thus, those baptized are no longer slaves to sin, but free. Fully identified with the death of Christ, they are buried with him and are raised here and now to a new life in the power of the resurrection of Jesus Christ, confident that they will also ultimately be one with him in a resurrection like his (Rom. 6:3–11; Col. 2:13,3:1; Eph. 2:5-6).[24]", "s055": "Through Baptism, we are cleansed from sin, the sin of Adam, and become new in Christ, the New Adam. Through the resurrection of Christ, there is a hope that we will be resurrected according to faith that we proclaim, “the resurrection of the body and life everlasting.” We will be there where He exists and have His being. We will see Him face to face. God will raise and glorify our own bodies in Christ. This is our hope.", "s057": "The baptism which makes Christians partakers of the mystery of Christ’s death and resurrection implies confession of sin and conversion of heart. The baptism administered by John was itself a baptism of repentance for the forgiveness of sins (Mark 1:4). The New Testament underlines the ethical implications of baptism by representing it as an ablution which washes the body with pure water, a cleansing of the heart of all sin, and an act of justification (Heb. 10:22; I Peter3:21; Acts 22:16; I Cor. 6:11). Thus, those baptized are pardoned, cleansed and sanctified by Christ, and are given as part of their baptismal experience a new ethical orientation under the guidance of the Holy Spirit.[25]", "s059": "We need to repent and desire conversion, a total metanoia of heart and change of lifestyle according to the examples of Christ. We need to renew our life every day, to be a new creation every morning, and to acknowledge our sinfulness at night before God. We have to follow the promptings of the Holy Spirit in our lives and be ready to take our part in the sanctification of the world.", "s061": "The Holy Spirit is at work in the lives of people before, in, and after their baptism. It is the same Spirit who revealed Jesus as the Son (Mark 1:10–11) and who empowered and united the disciples at Pentecost (Acts 2). God bestows upon all baptized persons the anointing and the promise of the Holy Spirit, marks them with a seal, and implants in their hearts the first instalment of their inheritance as sons and daughters of God. The Holy Spirit nurtures the life of faith in their hearts until the final deliverance when they will enter into its full possession, to the praise of the glory of God (II Cor. 1:21—22; Eph. 1:13-14).[26]", "s063": "In Christ’s baptism, the Holy Spirit descended upon Him. So, it is an example for us who were baptized and died with Him; the Holy Spirit descended upon us in our Baptism to sanctify us and inspire us to live a Christian way of life. The same Holy Spirit makes us united in the mission of the Church to stay united with our brothers and sisters in faith. It is the same Holy Spirit who sanctifies us and inspires us to do good works. It is the Holy Spirit who sustains us to live in this world as beloved sons and daughters of God.", "s065": "Administered in obedience to our Lord, baptism is a sign and seal of our common discipleship. Through baptism, Christians are brought into union with Christ, with each other, and with the Church of every time and place. Our common baptism, which unites us to Christ in faith, is thus a basic bond of unity. We are one people and are called to confess and serve one Lord in each place and in all the world. The union with Christ, which we share through baptism, has important implications for Christian unity. “There is... one baptism, one God and Father of us all ...” (Eph. 4:4—6). When baptismal unity is realized in one holy, catholic, apostolic Church, a genuine Christian witness can be made to the healing and reconciling love of God. Therefore, our one baptism into Christ constitutes a call to the churches to overcome their divisions and visibly manifest their fellowship.[27]", "s067": "We, who are baptized and are incorporated into the One Body of Christ, the Church, are to live with one mind and heart, according to the will of God in Christ. But in reality, we consist of different denominations, sometimes differing in the understanding of the Apostolic Faith. As members of the One Body – the Church of Christ, we are being called to unity (Jn 17:21) and reconciliation. It is a reality that Christians are divided, as manifested in the presence of different faith confessions. The ultimate call for us Christians is how we could come together and discern the call, the prayer of Christ for His disciples, “That all may be one” (Jn 17:21).", "s069": "The inability of the churches to mutually recognize their various practices of baptism as sharing in the one baptism, and their actual division despite mutual baptismal recognition, has given dramatic visibility to the broken witness of the Church. The readiness of the churches in some places and times to allow differences of sex, race, or social status to divide the body of Christ has further called into question genuine baptismal unity of the Christian community (Gal. 3:27—28) and has seriously compromised its witness. The need to recover baptismal unity is at the heart of the ecumenical task, as it is central to the realization of genuine partnership among Christian communities.[28]", "s071": "It is still a practice of Churches to rebaptize converts from different Churches. A valid Baptism cannot be repeated; a serious doubt can require investigation and conditional Baptism under Catholic canon law. We must consider the discernment of this aspect so as not to scandalize the practice of faith.", "s073": "Baptism initiates the reality of the new life given in the midst of the present world. It gives participation in the community of the Holy Spirit. It is a sign of the Kingdom of God and of the life of the world to come. Through the gifts of faith, hope, and love, baptism has a dynamic that embraces the whole of life, extends to all nations, and anticipates the day when every tongue will confess that Jesus Christ is Lord to the glory of God the Father.[29]", "s075": "Through the gifts of Baptism, we partake in the mission of Christ in the world. We have the identity as sons and daughters of God, brothers and sisters in faith in Jesus Christ, and partakers of the mission of Christ to save the world from slavery to sin and brokenness. We are called to manifest these realities through our desire to be united as one family of God in Christ Jesus, and are united in one mind and heart.", "s077": "Baptism is both God’s gift and our human response to that gift. It looks towards a growth into the measure of the stature of the fullness of Christ (Eph. 4:13). The necessity of faith for the reception of the salvation embodied and outlined in baptism is acknowledged by all churches. Personal commitment is necessary for responsible membership in the body of Christ.[30]", "s079": "We have to live out our identity. We are to show the world that we are true Christians in thoughts, words, and deeds. We have to live according to the precepts of the Sacred Scriptures and follow the examples of Christ. By living an ideal Christian life, we show the world who God is and the reason He sent His only Son to the world. We have to let the world know that we are all loved by a loving God.", "s081": "Baptism is related not only to momentary experience, but to lifelong growth into Christ. Those baptized are called upon to reflect the glory of the Lord as they are transformed by the power of the Holy Spirit, into his likeness, with ever-increasing splendor (II Cor. 3:18). The life of the Christian is necessarily one of continuing struggle yet also of continuing experience of grace. In this new relationship, the baptized live for the sake of Christ, of his Church and of the world which he loves, while they wait in hope for the manifestation of God’s new creation and for the time when God will be all in all (Rom. 8:18-24; I Cor. 15:22-28, 49-57).[31]", "s083": "It is our call to live patiently in this world. It is a vocation with uncertainties and challenges. The question is, “How could we live according to the life Christ wants us to live.” There are days that we are inspired, but there are also days that are dull. We have to live patiently and always depend on the grace that comes from God. The Holy Spirit will not abandon us. He always prompts us to what is good and holy if we will just entrust everything to Him. Our ultimate hope is to be with God with our whole being.", "s085": "As they grow in the Christian life of faith, baptized believers demonstrate that humanity can be regenerated and liberated. They have a common responsibility, here and now, to bear witness together to the Gospel of Christ, the Liberator of all human beings. The context of this common witness is the Church and the world. Within a fellowship of witness and service, Christians discover the full significance of the one baptism as the gift of God to all God’s people. Likewise, they acknowledge that baptism, as a baptism into Christ’s death, has ethical implications which not only call for personal sanctification, but also motivate Christians to strive for the realization of the will of God in all realms of life (Rom. 6:9ff; Gal. 3:27-28; I Peter 2:21-4:6).[32]", "s087": "The baptized are called to be like Christ in the world. They have their duty to work for the redemption of the human family – to purify cultures, protect the sanctity of life, and improve the lifestyle of others. It is a mandate to feed the hungry, clothe the naked, heal the sick, accompany the lonely, comfort the sorrowful, welcome the outcast, shelter the homeless, and enlighten the simple. It is in doing God’s work that Christians are to change the world for the better.", "s089": "While the possibility that infant baptism was also practiced in the apostolic age cannot be excluded, baptism upon personal profession of faith is the most clearly attested pattern in the New Testament documents. In the course of history, the practice of baptism has developed in a variety of forms. Some churches baptize infants brought by parents or guardians who are ready, in and with the Church, to bring up the children in the Christian faith. Other churches practice exclusively the baptism of believers who can make a personal confession of faith. Some of these churches encourage infants or children to be presented and blessed in a service which usually involves thanksgiving for the gift of the child and also the commitment of the mother and father to Christian parenthood. All churches baptize believers coming from other religions or from unbelief who accept the Christian faith and participate in catechetical instruction.[33]", "s091": "But it is not a new realization that many parents, most of whom are Catholics, neglect to teach their children the Christian faith while growing up after Baptism. One reason is that the parents themselves lack the information the faith has. Many of these parents are coming from millennial Catholic families. When the children had grown and encountered other faiths, it was easy for them to try that new faith and accept rebaptism – the same Trinitarian Baptism. That might be the reason dialogue between Churches is necessary.", "s093": "Both the baptism of believers and the baptism of infants take place in the Church as the community of faith. When one who can answer for himself or herself is baptized, a personal confession of faith will be an integral part of the baptismal service. When an infant is baptized, the personal response will be offered at a later moment in life. In both cases, the baptized person will have to grow in the understanding of faith. For those baptized upon their own confession of faith, there is always the constant requirement of a continuing growth of personal response in faith. In the case of infants, personal confession is expected later, and Christian nurture is directed to the eliciting of this confession. All baptism is rooted in and declares Christ’s faithfulness unto death. It has its setting within the life and faith of the Church and, through the witness of the whole Church, points to the faithfulness of God, the ground of all life in faith. At every baptism, the whole congregation reaffirms its faith in God and pledges itself to provide an environment of witness and service. Baptism should, therefore, always be celebrated and developed in the setting of the Christian community.[34]", "s095": "In the Catholic Church, infant Baptism is customary. But through the Sacrament of Confirmation, the baptized child can respond with faith when confirmed. Parents and the parish accompany the baptized in faith before and after Confirmation. The Church should make efforts to reach out to families, especially to those who do not go to Church frequently. Christians should be mindful of their identity and responsibility to bring other believers to the Church so that they may grow in faith also. Discipleship is not only for Protestants. It must also be practiced in Catholic circles. Basic Ecclesial Communities should be introduced in far-flung neighborhoods in the countryside where parishes have difficulty reaching.", "s097": "When the expressions “infant baptism” and “believers’ baptism” are used, it is necessary to keep in mind that the real distinction is between those who baptize people at any age and those who baptize only those able to confess faith for themselves. The differences between infant and believers’ baptism become less sharp when it is recognized that both forms of baptism embody God’s own initiative in Christ and express a response of faith made within the believing community. The practice of infant baptism emphasizes the corporate faith and the faith that the child shares with its parents. The infant is born into a broken world and shares in its brokenness. Through baptism, the promise and claim of the Gospel are laid upon the child. The personal faith of the recipient of baptism and faithful participation in the life of the Church are essential for the full fruit of baptism. The practice of believers’ baptism emphasizes the explicit confession of the person who responds to the grace of God in and through the community of faith and who seeks baptism. Both forms of baptism require a similar and responsible attitude towards Christian nurture. A rediscovery of the continuing character of Christian nurture may facilitate the mutual acceptance of different initiation practices. In some churches that unite both infant-baptism and believer-baptism traditions, it has been possible to regard as equivalent alternatives for entry into the Church both a pattern whereby baptism in infancy is followed by later profession of faith and a pattern whereby believers’ baptism follows upon a presentation and blessing in infancy. This example invites other churches to decide whether they, too, could not recognize equivalent alternatives in their reciprocal relationships and in church union negotiations.[35]", "s099": "The practice of the baptism of both expressions is commendable. Infant baptism is a common practice in both Catholic and Orthodox churches and even in many mainline Protestant churches. Other Protestant Churches do adult baptism. But it is wise to be truthful that many baptisms of those adult baptisms in the protestant Churches are sometimes rebaptisms, given that the participants are coming from other Churches.", "s101": "Baptism is an unrepeatable act. Any practice which might be interpreted as “rebaptism” must be avoided. Churches that have insisted on a particular form of baptism or which have had serious questions about the authenticity of other churches’ sacraments and ministries have at times required persons coming from other church traditions to be baptized before being received into full communicant membership. As the churches come to fuller mutual understanding and acceptance of one another and enter into closer relationships in witness and service, they will want to refrain from any practice which might call into question the sacramental integrity of other churches or which might diminish the unrepeatability of the sacrament of baptism.[36]", "s103": "As I have mentioned, dialogue between Churches regarding Sacraments should be practiced. The dignity of the Sacrament of Baptism should be studied so that Churches can avoid misunderstandings and even irregular acts. Rebaptism signals that the Sacraments of other Churches are void and null, which affects their very integrity as a Church. Sometimes, rebaptism even gives a signal to a “superiority” mentality.", "s105": "In God’s work of salvation, the paschal mystery of Christ’s death and resurrection is inseparably linked with the Pentecostal gift of the Holy Spirit. Similarly, participation in Christ’s death and resurrection is inseparably linked with the receiving of the Spirit. Baptism in its full meaning signifies and effects both. Christians differ in their understanding as to where the sign of the gift of the Spirit is to be found. Different actions have become associated with the giving of the Spirit. For some, it is the water rite itself. For others, it is the anointing with chrism and/or the imposition of hands, which many churches call confirmation. For still others, it is all three, as they see the Spirit operative throughout the rite. All agree that Christian baptism is in water and the Holy Spirit.[37]", "s107": "Baptism unites the mystery of Christ’s death and resurrection with the gift of the Holy Spirit. Although Christian traditions differ in how they express the reception of the Spirit through water, chrismation, or the laying on of hands, all are drawn into the one mystery of Baptism in Christ and the Holy Spirit. These differences invite the Churches to recognize the common grace they share while continuing to deepen their understanding of Christian initiation.", "s109": "Within some traditions, it is explained that as baptism conforms us to Christ crucified, buried, and risen, so through chrismation Christians receive the gift of the Pentecostal Spirit from the anointed Son. If baptism, as incorporation into the body of Christ, points by its very nature to the eucharistic sharing of Christ’s body and blood, the question arises as to how a further and separate rite can be interposed between baptism and admission to communion. Those churches that baptize children but refuse them a share in the eucharist before such a rite may wish to ponder whether they have fully appreciated and accepted the consequences of baptism. Baptism needs to be constantly reaffirmed. The most obvious form of such reaffirmation is the celebration of the Eucharist. The renewal of baptismal vows may also take place during such occasions as the annual celebration of the paschal mystery or during the baptism of others.[38]", "s111": "Baptism, Confirmation, and Eucharist should not be understood as isolated realities but as movements within one Christian initiation into Christ. If Baptism incorporates us into the Body of Christ, then the Eucharist naturally becomes the nourishment of that life. This raises an important ecumenical question: whether our different practices surrounding initiation sometimes obscure the communion already given in Baptism. The constant renewal of baptismal identity through the Eucharist reminds us that Christian life is not a single moment of initiation but an ongoing participation in the death, resurrection, and life of Christ. In this sense, the Eucharist continually gathers the baptized into the communion for which Christ prayed.", "s113": "Towards Mutual Recognition of Baptism. Churches are increasingly recognizing one another’s baptism as the one baptism into Christ when Jesus Christ has been confessed as Lord by the candidate or, in the case of infant baptism, when confession has been made by the church (parents, guardians, godparents, and congregation) and affirmed later by personal faith and commitment. Mutual recognition of baptism is acknowledged as an important sign and means of expressing the baptismal unity given in Christ. Wherever possible, mutual recognition should be expressed explicitly by the churches.[39]", "s115": "It is commendable to say that if Baptism’s formula is Trinitarian and done properly with water and genuine intention of the candidate or the community. Sometimes, in intermarriage and even admission to other Churches, Church leaders require the candidate to be rebaptized. When Churches adopt mutual recognition of Baptism, they avoid scandal. It may not be called a “scandal’ but it seems an irregularity of rules regarding the spiritual precepts of the sacrament of Baptism.", "s117": "To overcome their differences, believers in baptism and those who practice infant baptism should reconsider certain aspects of their practices. The former may seek to express more visibly the fact that children are placed under the protection of God’s grace. The latter must guard themselves against the practice of apparently indiscriminate baptism and take more seriously their responsibility for the nurture of baptized children to mature commitment to Christ.[40]", "s119": "Both traditions are invited to examine their practices with humility and openness. Those who practice believer’s baptism can give greater attention to the place of children within God’s grace, while those who practice infant baptism are reminded of their responsibility to nurture baptized children toward mature faith and commitment to Christ. Ecumenical dialogue becomes fruitful when each tradition is willing to recognize what the other can teach it. In this way, Baptism becomes not a reason for division but an invitation to deeper mutual understanding and communion in Christ.", "s121": "Baptism is administered with water in the name of the Father, the Son, and the Holy Spirit. In the celebration of baptism, the symbolic dimension of water should be taken seriously and not minimized. The act of immersion can vividly express the reality that in baptism the Christian participates in the death, burial, and resurrection of Christ. As seen in some theological traditions, the use of water, with all its positive associations with life and blessing, signifies the continuity between the old and the new creation, thus revealing the significance of baptism not only for human beings but also for the whole cosmos. At the same time, the use of water represents a purification of creation, a dying to that which is negative and destructive in the world: those who are baptized into the body of Christ are made partakers of a renewed existence.[41]", "s123": "Some other Churches do not use the Trinitarian formula. It is a possibility that when members of these churches or ecclesial communities are rebaptized, they must be validly received into the sacrament. But still, the decision of the baptized should be conscientious. If the validity is doubtful, competent ministers must investigate the original rite under Church law; Baptism is not simply a personal preference but should be according to ecclesiastical norms.", "s125": "As was the case in the early centuries, the gift of the Spirit in baptism may be signified in addition, for example, by the sign of the laying on of hands, and by anointing or chrismation. The very sign of the cross recalls the promised gift of the Holy Spirit, who is the instalment and pledge of what is yet to come when God has fully redeemed those whom he has made his own (Eph. 1:13-14). The recovery of such vivid signs may be expected to enrich the liturgy.[42]", "s127": "The gifts of the Holy Spirit in Baptism remind us that God’s grace is made visible through the life and worship of the Church. The laying on of hands, anointing, chrismation, and the sign of the cross point to the presence and work of the Holy Spirit in the baptized. These sacred signs help the faithful understand more deeply the mystery they celebrate and remind them that Baptism is the beginning of a lifelong journey of sanctification. Recovering these vivid signs can therefore enrich the liturgy and awaken in the faithful a deeper appreciation of the gift of the Holy Spirit received in Baptism.", "s129": "Within any comprehensive order of baptism, at least the following elements should find a place: the proclamation of the scriptures referring to baptism; an invocation of the Holy Spirit; a renunciation of evil; a profession of faith in Christ and the Holy Trinity; the use of water; a declaration that the persons baptized have acquired a new identity as sons and daughters of God, and as members of the Church, called to be witnesses of the Gospel. Some churches consider that Christian initiation is not complete without the sealing of the baptized with the gift of the Holy Spirit and participation in holy communion.[43]", "s131": "Baptism brings together the Word of God, the Holy Spirit, faith, water, and the renunciation of evil in one profound act of Christian initiation. Through this sacrament, the baptized receive a new identity as sons and daughters of God and as members of the Church. This identity is not only a privilege but also a responsibility to become witnesses of the Gospel and to live according to the faith received. The gift of the Holy Spirit continually strengthens the baptized, while participation in the Eucharist nourishes their communion with Christ and with one another. Thus, Christian initiation leads us into a lifelong journey of faith, holiness, and service, in which the grace received in Baptism continues to bear fruit in the life of the Church and in the world.", "s133": "It is appropriate to explain, in the context of the baptismal service, the meaning of baptism as it appears in the scriptures (i.e., participation in Christ’s death and resurrection, conversion, pardon and cleansing, the gift of the Spirit, incorporation into the body of Christ, and the sign of the Kingdom).[44]", "s135": "Baptism is rich in meaning because it unites the baptized with the whole mystery of Christ and the life of the Church. Through participation in Christ’s death and resurrection, we are called to conversion, receive forgiveness and cleansing, and are renewed by the Holy Spirit. Through Baptism, we are incorporated into the Body of Christ and become partakers in the life of the Church. It is also a sign of the Kingdom, reminding us that the new life received in Christ is directed toward the fullness of communion with God. Understanding these meanings more deeply can help the baptized appreciate the grace they have received and live more faithfully in accordance with their identity as members of Christ and witnesses to His Gospel.", "s137": "Recent discussion indicates that more attention should be given to misunderstandings encouraged by the socio-cultural context in which baptism takes place. (a)In some parts of the world, the giving of a name in the baptismal liturgy has led to confusion between baptism and customs surrounding name-giving. This confusion is especially harmful if, in cultures predominantly not Christian, the baptized are required to assume Christian names not rooted in their cultural tradition. In making regulations for baptism, churches should be careful to keep the emphasis on the true Christian significance of baptism and to avoid unnecessarily alienating the baptized from their local culture through the imposition of foreign names. A name which is inherited from one’s original cultural roots, the baptized in that culture, and at the same time manifests the universality of baptism, incorporation into the one Church, holy, catholic, and apostolic, which stretches over all the nations of the earth. (b)In many large European and North American majority churches, infant baptism is often practiced in an apparently indiscriminate way. This contributes to the reluctance of churches that practice believer’s baptism to acknowledge the validity of infant baptism; this fact should lead to more critical reflection on the meaning of baptism within those majority churches themselves. (c)Some African churches practice baptism of the Holy Spirit without water, through the laying on of hands, while recognizing other churches’ baptism. A study is required concerning this practice and its relation to baptism with water.[45]", "s139": "Baptism must be celebrated with sensitivity to the cultures, traditions, and circumstances of the people who receive it. The universality of the Church does not require the baptized to abandon their cultural identity; rather, Baptism welcomes every culture into the one Body of Christ. The Churches therefore have a responsibility to distinguish the essential meaning of Baptism from practices that may cause confusion or unnecessarily alienate people from their cultural heritage. At the same time, every Christian tradition must honestly examine its own practices and remain open to learning from the experiences of others. Our differences in the manner of Christian initiation should invite deeper reflection rather than immediate judgment. In this way, Baptism can truly become a sign of the catholicity of the Church, where peoples of different cultures and traditions are gathered into one communion in Christ.", "s141": "Baptism is normally administered by an ordained minister, though in certain circumstances others are allowed to baptize. Since baptism is intimately connected with the corporate life and worship of the Church, it should normally be administered during public worship, so that the members of the congregation may be reminded of their own baptism and may welcome into their fellowship those who are baptized and whom they are committed to nurturing in the Christian faith. The sacrament is appropriate to great festival occasions such as Easter, Pentecost, and Epiphany, as was the practice in the early Church.[46]", "s143": "Baptism is not a private celebration but an incorporation into the worshipping and living community of the Church. When the sacrament is celebrated in the presence of the congregation, the baptized person is welcomed into a community that accepts the responsibility of accompanying and nurturing him or her in the Christian faith. At the same time, the congregation is reminded of its own Baptism and renewed in its calling to live as one Body in Christ. The celebration of Baptism during great feasts such as Easter, Pentecost, and Epiphany also connects the sacrament with the central mysteries of the Christian faith: the resurrection of Christ, the gift of the Holy Spirit, and the manifestation of Christ to the world. Baptism therefore joins the newly baptized not only to Christ but also to His people, where faith is received, nourished, celebrated, and lived in communion with others.", "s145": "ON THE EUCHARIST", "s147": "The Church receives the Eucharist as a gift from the Lord. St Paul wrote: “I have received from the Lord what I also delivered to you, that the Lord Jesus on the night when he was betrayed took bread, and when he had given thanks, he broke it, and said: `This is my body, which is for you. Do this in remembrance (anamnesis) of me.’ In the same way, also the cup, after supper, saying: `This cup is the new covenant in my blood. Do this, as often as you drink it, in remembrance of me.’ “(I Cor. 11:23–25; cf. Matt. 26:26–29; Mark 14:22–25; Luke 22:14–20). The meals which Jesus is recorded as sharing during his earthly ministry proclaim and enact the nearness of the Kingdom, of which the feeding of the multitudes is a sign. In his last meal, the fellowship of the Kingdom was connected with the imminence of Jesus’ suffering. After his resurrection, the Lord made his presence known to his disciples in the breaking of the bread. Thus, the eucharist continues these meals of Jesus during his earthly life and after his resurrection, always as a sign of the Kingdom. Christians see the eucharist prefigured in the Passover memorial of Israel’s deliverance from the land of bondage and in the meal of the Covenant on Mount Sinai. It is the new paschal meal of the Church, the meal of the New Covenant, which Christ gave to his disciples as the anamnesis of his death and resurrection, as the anticipation of the Supper of the Lamb (Rev. 19:9). Christ commanded his disciples thus to remember and encounter him in this sacramental meal, as the continuing people of God, until his return. The last meal celebrated by Jesus was a liturgical meal employing symbolic words and actions. Consequently, the eucharist is a sacramental meal which by visible signs communicates to us God’s love in Jesus Christ, the love by which Jesus loved his own “to the end” (John 13:1). It has acquired many names: for example, the Lord’s Supper, the breaking of bread, the holy communion, the divine liturgy, the mass. Its celebration continues as the central act of the Church’s worship.[47]", "s149": "The Eucharist is the continuing gift of Christ to His Church, through which we remember, encounter, and proclaim the mystery of His death and resurrection. In the Eucharistic celebration, the Church gathers as the people of the New Covenant and receives the love of Christ who gave Himself completely for the salvation of the world. The Eucharist is therefore not simply a remembrance of an event in the past, but a living encounter with Christ and an anticipation of the fullness of the Kingdom. As Christians from different traditions gather around the mystery of the Lord’s Supper, the many names and liturgical expressions of the Eucharist remind us of the richness of the Christian tradition while pointing toward the one Christ whom we proclaim. Since the Eucharist stands at the center of the Church’s worship, it also calls us to deepen our communion with Christ and with one another, so that the Church may increasingly become a visible sign of the unity for which Christ prayed.", "s151": "The eucharist is essentially the sacrament of the gift which God makes to us in Christ through the power of the Holy Spirit. Every Christian receives this gift of salvation through communion in the body and blood of Christ. In the eucharistic meal, in the eating and drinking of the bread and wine, Christ grants communion with himself. God himself acts, giving life to the body of Christ and renewing each member. In accordance with Christ’s promise, each baptized member of the body of Christ receives in the eucharist the assurance of the forgiveness of sins (Matt. 26:28) and the pledge of eternal life (John 6:51- 58). Although the eucharist is essentially one complete act, it will be considered here under the following aspects: thanks- giving to the Father, memorial of Christ, invocation of the Spirit, communion of the faithful, meal of the Kingdom.[48]", "s153": "The Eucharist is the living gift of Christ to His Church through the power of the Holy Spirit. The Eucharist strengthens charity and remits venial sin, but is not ordered to the forgiveness of mortal sin. Catholics conscious of grave sin ordinarily receive sacramental absolution before Holy Communion. The Eucharist brings together thanksgiving to the Father, remembrance of Christ’s death and resurrection, the invocation of the Holy Spirit, the communion of the faithful, and the anticipation of the Kingdom. These realities are not separate from one another but form one mystery of communion. As we receive the Body and Blood of Christ, we are continually renewed by God’s grace and strengthened to live as one people in Christ. The Eucharist, therefore, calls us beyond individual devotion toward a deeper communion expressed in love, service, and the unity of the whole Church. But it is not an assumption that all Christian Eucharist are valid in the eyes of the Catholic Church. Not every baptized Christian may receive it from the Catholic Church.", "s155": "The Eucharist, which always includes both word and sacrament, is a proclamation and a celebration of the work of God. It is the great thanksgiving to the Father for everything accomplished in creation, redemption, and sanctification, for everything accomplished by God now in the Church and in the world despite the sins of human beings, for everything that God will accomplish in bringing the Kingdom to fulfilment. Thus, the eucharist is the benediction (berakah) by which the Church expresses its thankfulness for all God’s benefits.[49]", "s157": "The Eucharist teaches the Church to become a people of thanksgiving. In the midst of the blessings and struggles of human life, we gather to acknowledge that everything we have ultimately comes from God and that His saving work continues in creation, redemption, and sanctification. Even when the world is wounded by human sin, the Church continues to give thanks because God remains faithful and continues to work toward the fulfillment of His Kingdom. The Eucharist therefore forms our hearts to recognize God’s goodness not only in moments of joy but also in the midst of suffering and uncertainty. As we give thanks together, we are reminded that we belong to one people of God, called to receive His gifts with gratitude and to become instruments of His love and generosity in the world.", "s159": "The eucharist is the great sacrifice of praise by which the Church speaks on behalf of the whole creation. For the world which God has reconciled is present at every eucharist: in the bread and wine, in the persons of the faithful, and in the prayers they offer for themselves and for all people. Christ unites the faithful with himself and includes their prayers within his own intercession so that the faithful are transfigured and their prayers accepted. This sacrifice of praise is possible only through Christ, with him and in him. The bread and wine, fruits of the earth and of human labor, are presented to the Father in faith and thanksgiving. The eucharist thus signifies what the world is to become: an offering and hymn of praise to the Creator, a universal communion in the body of Christ, a kingdom of justice, love, and peace in the Holy Spirit.[50]", "s161": "The Eucharist is the sacrifice of praise of the whole Church, offered through Christ, with Christ, and in Christ. In the bread and wine, the fruits of the earth and the labor of human hands are brought before the Father, while the prayers of the faithful are united with the intercession of Christ. The Eucharist therefore gathers not only the baptized but, in a profound sense, the whole creation into an offering of thanksgiving to God. As we participate in this mystery, we are also called to become what we celebrate: a people transformed by Christ into instruments of justice, love, and peace. The Eucharist reminds us that communion with Christ cannot remain confined to the liturgical celebration; it must become a way of life through which Christians work together for the renewal of the world and for the coming of God’s Kingdom.", "s163": "The eucharist is the memorial of the crucified and risen Christ, i.e., the living and effective sign of his sacrifice, accomplished once and for all on the cross and still operative on behalf of all humankind. The biblical idea of memorial as applied to the eucharist refers to this present efficacy of God’s work when it is celebrated by God’s people in a liturgy.[51]", "s165": "The Eucharist makes present to the Church the saving mystery of Christ’s death and resurrection. The memorial we celebrate is not merely a remembrance of something that happened in the past, but a living participation in the saving work of Christ, whose sacrifice continues to bear its fruits for humanity. Whenever the Church gathers around the Eucharistic table, the faithful are drawn into this mystery and reminded that the grace of the Cross and Resurrection remains active in their lives. Through this memorial, Christ continually renews His people and calls them to live according to the new life He has accomplished for them. The Eucharist therefore unites the past, the present, and the hope of the future in one celebration of Christ’s saving love.", "s167": "Christ himself, with all that he has accomplished for us and for all creation (in his incarnation, servanthood, ministry, teaching, suffering, sacrifice, resurrection, ascension, and sending of the Spirit), is present in this anamnesis, granting us communion with himself. The eucharist is also the foretaste of his Parousia and of the final kingdom.[52]", "s169": "In the Eucharist, Christ is present to His Church with the fullness of His saving work. His incarnation, ministry, suffering, death, resurrection, ascension, and the sending of the Holy Spirit are not distant events separated from the life of the faithful, but mysteries through which Christ continues to draw us into communion with Himself. The Eucharist therefore unites us with the whole mystery of Christ and reminds us that our Christian life is rooted in His complete self-giving love. At the same time, the Eucharist directs our hearts toward the future, giving us a foretaste of the coming of Christ and the fullness of His Kingdom. As we receive Christ in the present, we are strengthened to live faithfully while awaiting the day when His Kingdom will be fully revealed.", "s171": "The anamnesis in which Christ acts through the joyful celebration of His Church is thus both representation and anticipation. It is not only a calling to mind of what is past and of its significance. It is the Church’s effective proclamation of God’s mighty acts and promises.[53]", "s173": "The Eucharist is not merely the remembrance of what God has accomplished in the past, but the joyful proclamation of His saving work and His promises. Through the anamnesis, the Church celebrates the mighty acts of God and makes them present to the life of the faithful while anticipating their fulfillment in the Kingdom. Every Eucharistic celebration therefore becomes an act of proclamation: the Church remembers Christ, encounters Him in the present, and confidently announces the hope of His coming. In celebrating the Eucharist, we become a people who continually proclaim the faith we have received and bear witness to the salvation God has accomplished in Christ.", "s175": "Representation and anticipation are expressed in thanksgiving and intercession. The Church, gratefully recalling God’s mighty acts of redemption, beseeches God to give the benefits of these acts to every human being. In thanksgiving and intercession, the Church is united with the Son, its great High Priest and Intercessor (Rom. 8:34; Heb. 7:25). The eucharist is the sacrament of the unique sacrifice of Christ, who lives to make intercession for us. It is the memorial of all that God has done for the salvation of the world. What it was God’s will to accomplish in the incarnation, life, death, resurrection, and ascension of Christ, God does not repeat. These events are unique and can neither be repeated nor prolonged. In the memorial of the Eucharist, however, the Church offers its intercession in communion with Christ, our great High Priest.[54]", "s177": "The Eucharist gathers the Church into the thanksgiving and intercession of Christ, our great High Priest. As we remember with gratitude the saving work of God, we are also moved to pray for the needs of the whole human family. The Church does not repeat Christ’s unique sacrifice, for His incarnation, suffering, death, resurrection, and ascension happened once for the salvation of the world. Rather, in the Eucharistic memorial, we participate in the continuing intercession of the risen Christ, who continually brings His people before the Father. Thus, the Eucharist teaches us that communion with Christ also means becoming a people who give thanks, intercede for others, and carry the hopes and sufferings of humanity into the presence of God.", "s179": "It is in the light of the significance of the Eucharist as intercession that references to the Eucharist in Catholic theology as “propitiatory sacrifice” may be understood. The understanding is that there is only one expiation, that of the unique sacrifice of the cross, made actual in the eucharist and presented before the Father in the intercession of Christ and of the Church for all humanity. In light of the biblical conception of memorial, all churches might want to review the old controversies about “sacrifice” and deepen their understanding of the reasons why other traditions than their own have either used or rejected this term.[55]", "s181": "The Eucharist invites Christians to approach the mystery of sacrifice with humility and deeper understanding. The sacrifice of Christ is unique and complete, accomplished once for the salvation of the world, while in the Mass the same sacrifice is made sacramentally present; the Church participates in this offering through, with, and in Christ. The different traditions of Christianity have developed different ways of expressing their understanding of this mystery, and these differences have sometimes become sources of division. Rather than allowing old controversies to continue separating Christians, we should listen to one another with respect and seek to understand why certain traditions have retained the language of sacrifice while others have been hesitant to use it. Through sincere dialogue, prayer, and deeper study of Scripture and the Christian tradition, the Churches may discover that what has divided them can also become an opportunity to grow together in the understanding of the one saving sacrifice of Christ.", "s183": "The anamnesis of Christ is the basis and source of all Christian prayer. So, our prayer relies upon and is united with the continual intercession of the risen Lord. In the eucharist, Christ empowers us to live with him, to suffer with him, and to pray through him as justified sinners, joyfully and freely fulfilling his will.[56]", "s185": "The Eucharist teaches us that Christian prayer is always united with the prayer of Christ. Through the anamnesis, we are drawn into the continual intercession of the risen Lord and learn to offer our joys, sufferings, hopes, and concerns through Him to the Father. In receiving Christ in the Eucharist, we are strengthened not only to live with Him but also to suffer with Him and to follow His will with freedom and joy. The Eucharist therefore transforms prayer from a personal act into an act of communion with Christ and with the whole Church. As we pray through Christ, we also learn to carry the needs of our brothers and sisters before God and to make our own lives an offering of love in service to others.", "s187": "In Christ we offer ourselves as a living and holy sacrifice in our daily lives (Rom. 12:1; I Peter 2:5); this spiritual worship, acceptable to God, is nourished in the eucharist, in which we are sanctified and reconciled in love, to be servants of reconciliation in the world.[57]", "s189": "The Eucharist nourishes us to offer our whole lives to God as a living sacrifice. Through communion with Christ, we are sanctified and reconciled in His love, and this reconciliation should become visible in the way we relate to others. We cannot truly receive the gift of Christ while remaining indifferent to the wounds and divisions around us. The Eucharist therefore sends us forth from the celebration as servants of reconciliation, called to bring healing, peace, and love into our families, communities, Churches, and societies. In offering ourselves with Christ, our daily lives become an extension of the Eucharistic mystery, through which the love of God continues to reach the world.", "s191": "United to our Lord and in communion with all the saints and martyrs, we are renewed in the covenant sealed by the blood of Christ.[58]", "s193": "The Eucharist unites us not only with Christ but also with the communion of saints who have remained faithful to Him. In celebrating this mystery, we remember that the Church is a people gathered across generations, cultures, and circumstances, united by the one covenant sealed in the blood of Christ. The witness of the saints and martyrs reminds us that communion with Christ calls for faithfulness, sacrifice, and perseverance. As we participate in the Eucharist, we are renewed in this covenant and strengthened to continue the same journey of faith, remaining united with Christ and with all His people.", "s195": "Since the anamnesis of Christ is the very content of the preached Word as it is of the eucharistic meal, each reinforces the other. The celebration of the eucharist properly includes the proclamation of the Word.[59]", "s197": "The Word of God and the Eucharist are inseparably connected in the life of the Church. Through the proclamation of the Scriptures, Christ speaks to His people and prepares them to encounter Him in the Eucharistic mystery. The Word nourishes our faith, while the Eucharist makes the saving mystery proclaimed in the Word a living celebration of communion with Christ. Neither should be separated from the other, for both proclaim and make present the same saving work of God. As Christians listen to the Word and partake in the Eucharist, they are continually formed as one people, strengthened in faith, and sent forth to bear witness to the Gospel in the world.", "s199": "The words and acts of Christ at the institution of the Eucharist stand at the heart of the celebration; the eucharistic meal is the sacrament of the body and blood of Christ, the sacrament of his real presence. Christ fulfills in a variety of ways his promise to be always with his own even to the end of the world. But Christ’s mode of presence in the eucharist is unique. Jesus said over the bread and wine of the eucharist: “This is my body ... this is my blood ...” What Christ declared is true, and this truth is fulfilled every time the eucharist is celebrated. The Church confesses Christ’s real, living, and active presence in the eucharist. While Christ’s real presence in the eucharist does not depend on the faith of the individual, all agree that to discern the body and blood of Christ, faith is required. Many churches believe that by the words of Jesus and by the power of the Holy Spirit, the bread and wine of the eucharist become, in a real though mysterious manner, the body and blood of the risen Christ, i.e., of the living Christ present in all his fullness. Under the signs of bread and wine, the deepest reality is the total being of Christ who comes to us to feed us and transform our entire being. Some other churches, while affirming a real presence of Christ at the eucharist, do not link that presence so definitely with the signs of bread and wine. The decision remains for the churches whether this difference can be accommodated within the convergence formulated in the text itself [60]", "s201": "At valid consecration, the whole substance of bread and wine becomes Christ’s Body and Blood: transubstantiation. In the words and actions of Christ at the institution of the Eucharist, we encounter the mystery of His body and blood and the promise of His abiding presence among His people. Although the Churches may differ in how they explain the manner of Christ’s presence in the Eucharistic signs, all Christians are called to approach this mystery with faith, reverence, and humility. The Eucharist is not merely an object of theological discussion but an encounter with the living Christ who comes to nourish and transform His people. If we truly discern Christ in the Eucharistic mystery, our communion with Him should also lead us toward greater communion with one another. Therefore, the differences among Christians regarding the Eucharist call not only for theological study but also for prayer, charity, and a sincere desire to discover the unity already given to us in Christ.", "s203": "The Spirit makes the crucified and risen Christ really present to us in the eucharistic meal, fulfilling the promise contained in the words of institution. The presence of Christ is clearly the center of the eucharist, and the promise contained in the words of institution is therefore fundamental to the celebration. Yet it is the Father who is the primary origin and final fulfilment of the eucharistic event. The incarnate Son of God by and in whom it is accomplished is its living center. The Holy Spirit is the immeasurable strength of love which makes it possible and continues to make it effective. The bond between the eucharistic celebration and the mystery of the Triune God reveals the role of the Holy Spirit as that of the One who makes the historical words of Jesus present and alive. Being assured by Jesus’ promise in the words of institution that it will be answered, the Church prays to the Father for the gift of the Holy Spirit in order that the eucharistic event may be a reality: the real presence of the crucified and risen Christ giving his life for all humanity. This is not to spiritualize the eucharistic presence of Christ but to affirm the indissoluble union between the Son and the Spirit. This union makes it clear that the eucharist is not a magical or mechanical action but a prayer addressed to the Father, one which emphasizes the Church’s utter dependence. There is an intrinsic relationship between the words of institution, Christ’s promise, and the epiclesis, the invocation of the Spirit, in the liturgy. The epiclesis in relation to the words of institution is located differently in various liturgical traditions. In the early liturgies, the whole “prayer action” was thought of as bringing about the reality promised by Christ. The invocation of the Spirit was made both on the community and on the elements of bread and wine. Recovery of such an understanding may help us overcome our difficulties concerning a special moment of consecration.[61]", "s205": "The Eucharist is the work of the Triune God, in which the Father gives, the Son gives Himself, and the Holy Spirit makes this mystery present and alive in the Church. The real presence of Christ in the Eucharist therefore cannot be separated from the action of the Holy Spirit, who unites the Church with the crucified and risen Lord. The Eucharistic celebration is not a magical or mechanical action but a prayer of the Church in complete dependence upon God. The different liturgical traditions may express the relationship between the words of institution and the epiclesis in different ways, yet these differences can become opportunities for deeper theological understanding rather than barriers to communion. As the Church gathers in prayer around the Eucharistic mystery, she receives Christ through the power of the Spirit and is drawn more deeply into the life of the Father, becoming a people united in faith, worship, and love.", "s207": "It is in virtue of the living word of Christ and by the power of the Holy Spirit that the bread and wine become the sacramental signs of Christ’s body and blood. They remain so for communion. In the history of the Church, there have been various attempts to understand the mystery of the real and unique presence of Christ in the Eucharist. Some are content merely to affirm this presence without seeking to explain it. Others consider it necessary to assert a change wrought by the Holy Spirit and Christ’s words, in consequence of which there is no longer just ordinary bread and wine but the body and blood of Christ. Others again have developed an explanation of the real presence which, though not claiming to exhaust the significance of the mystery, seeks to protect it from damaging interpretations.[62]", "s209": "The Eucharist remains a profound mystery of Christ’s living presence, brought about through His word and the power of the Holy Spirit. Throughout Christian history, the Churches have sought different ways to express and understand this mystery, with some emphasizing the reality of Christ’s presence without attempting to define its manner, while others have developed theological explanations to safeguard and articulate that reality. These differences remind us that the mystery of Christ’s presence cannot be completely contained by human language. Ecumenical dialogue therefore calls Christians to distinguish between the mystery itself and the particular theological language used to explain it. With humility and reverence, the Churches can learn from one another while remaining faithful to the conviction that Christ truly gives Himself to His people in the Eucharist.", "s211": "The whole action of the Eucharist has an “epikletic” character because it depends upon the work of the Holy Spirit. In the words of the liturgy, this aspect of the Eucharist finds varied expression.[63]", "s213": "The Holy Spirit is at work throughout the whole Eucharistic celebration, making the Church aware that the Eucharist is the work of God and not merely a human action. Through the invocation of the Spirit, the Church depends completely upon God for the fulfillment of Christ’s promise and for the sanctification of His people. Although the different liturgical traditions express the epiclesis in various ways, they all remind us of the active presence of the Holy Spirit in the Eucharistic mystery. The Eucharist therefore calls the Church to remain open to the movement of the Spirit, who continually unites, sanctifies, and renews the Body of Christ.", "s215": "The Church, as the community of the new covenant, confidently invokes the Spirit, so that it may be sanctified and renewed, led into all justice, truth, and unity, and empowered to fulfil its mission in the world.[64]", "s217": "The Holy Spirit does not only make the Eucharistic mystery present; He also renews the Church that celebrates it. As the community of the New Covenant, the Church continually depends upon the Spirit to lead her toward justice, truth, and unity. The Eucharist therefore becomes a source of renewal for the whole Christian community, strengthening its members to live faithfully and to fulfill their mission in the world. To invoke the Holy Spirit is also to accept the responsibility of allowing Him to transform our relationships, heal divisions, and guide us toward deeper communion. A Church renewed by the Spirit becomes a Church capable of witnessing to Christ through love, service, justice, and unity.", "s219": "The Holy Spirit, through the Eucharist, gives a foretaste of the Kingdom of God: The Church receives the life of the new creation and the assurance of the Lord’s return. [65]", "s221": "Through the Eucharist, the Holy Spirit gives us a foretaste of God’s Kingdom and renews us with the hope of Christ’s return. It reminds us that we are already partakers in the new creation and called to live in anticipation of its fullness.", "s223": "The eucharistic communion with Christ, who nourishes the life of the Church, is at the same time communion within the body of Christ, which is the Church. The sharing in one bread and the common cup in a given place demonstrates and affects the oneness of the sharers with Christ and with their fellow sharers in all times and places. It is in the eucharist that the community of God’s people is fully manifested. Eucharistic celebrations always have to do with the whole Church, and the whole Church is involved in each local eucharistic celebration. In so far as a church claims to be a manifestation of the whole Church, it will take care to order its own life in ways which take the interests and concerns of other churches. Since the earliest days, baptism has been understood as the sacrament by which believers are incorporated into the body of Christ and are endowed with the Holy Spirit. As long as the right of the baptized believers and their ministers to participate in and preside over eucharistic celebration in one church is called into question by those who preside over and are members of other eucharistic congregations, the catholicity of the eucharist is less manifest. There is discussion in many churches today about the inclusion of baptized children as communicants at the Lord’s Supper.[66]", "s225": "The Eucharist manifests the unity of the Body of Christ, joining believers not only to Christ but also to one another across times, places, and traditions. Therefore, Eucharistic communion calls the Churches to recognize one another as members of the one Body and to take the dignity and participation of all baptized Christians. When divisions prevent Christians from sharing fully in the Eucharist, the catholicity of the Church is less visibly expressed. The Eucharist thus challenges us to seek deeper communion, mutual recognition, and unity in Christ.", "s227": "The Eucharist embraces all aspects of life. It is a representative act of thanksgiving and offering on behalf of the whole world. The eucharistic celebration demands reconciliation and sharing among all those regarded as brothers and sisters in the one family of God and is a constant challenge in the search for appropriate relationships in social, economic and political life (Matt. 5:23f; I Cor. 10:16f; I Cor. 11:20—22; Gal. 3:28). All kinds of injustice, racism, separation and lack of freedom are radically challenged when we share in the body and blood of Christ. Through the eucharist, the all-renewing grace of God penetrates and restores human personality and dignity. The eucharist involves the believer in the central event of the world’s history. As participants in the eucharist, therefore, we prove inconsistent if we are not actively participating in this ongoing restoration of the world’s situation and the human condition. The eucharist shows us that our behavior is inconsistent in the face of the reconciling presence of God in human history: we are placed under continual judgment by the persistence of unjust relationships of all kinds in our society, the manifold divisions on account of human pride, material interest, and power politics, and, above all, the obstinacy of unjustifiable confessional oppositions within the body of Christ.[67]", "s229": "The Eucharist calls us to extend the communion we receive in Christ into every aspect of human life. Sharing in the one Body of Christ challenges injustice, racism, division, and every relationship built upon pride, power, or exclusion. We cannot fully celebrate the Eucharist while remaining indifferent to the suffering and dignity of others. The grace of the Eucharist therefore sends us into the world as servants of reconciliation, justice, and peace, working together to restore human relationships and witness to the unity for which Christ prayed.", "s231": "Solidarity in the eucharistic communion of the body of Christ and responsible care of Christians for one another and the world find specific expression in the liturgies: in the mutual forgiveness of sins; the sign of peace; intercession for all; the eating and drinking together; the taking of the elements to the sick and those in prison, or the celebration of the eucharist with them. All these manifestations of love in the eucharist are directly related to Christ’s own testimony as a servant, in whose servanthood Christians themselves participate. As God in Christ has entered into the human situation, so eucharistic liturgy is near to the concrete and particular situations of men and women. In the early Church, the ministry of deacons and deaconesses gave expression in a special way to this aspect of the eucharist. The place of such ministry between the table and the needy properly testifies to the redeeming presence of Christ in the world. [68]", "s233": "The Eucharist calls Christians to make communion visible through concrete acts of love and service. The forgiveness, peace, intercession, sharing, and care for the sick, imprisoned, and needy reveal Christ’s own servant-hearted love. Those who receive Christ at the Eucharistic table are therefore sent to serve others, especially those who suffer and are forgotten. The Eucharist becomes truly transformative when communion with Christ leads us to communion with the vulnerable and to responsible care for the world.", "s235": "The Eucharist opens up the vision of the divine rule which has been promised as the final renewal of creation, and is a foretaste of it. Signs of this renewal are present in the world wherever the grace of God is manifest and human beings work for justice, love, and peace. The eucharist is the feast at which the Church gives thanks to God for these signs and joyfully celebrates and anticipates the coming of the Kingdom in Christ (I Cor. 11:26; Matt. 26:29).[69]", "s237": "The Eucharist gives the Church a foretaste of the Kingdom of God, where creation will be renewed in justice, love, and peace. Every act of grace, compassion, and justice in the world becomes a sign of this coming Kingdom. As we celebrate the Eucharist, we give thanks for these signs and are strengthened to participate in God’s continuing work of renewal. The Eucharist therefore forms us to live in hope while actively working for the realization of the Kingdom in the world.", "s239": "The world, to which renewal is promised, is present in the whole eucharistic celebration. The world is present in the thanksgiving to the Father, where the Church speaks on behalf of the whole creation; in the memorial of Christ, where the Church, united with its great High Priest and Intercessor, prays for the world; in the prayer for the gift of the Holy Spirit, where the Church asks for sanctification and new creation.[70]", "s241": "The Eucharist embraces the whole world in the prayer of the Church. In thanksgiving, memorial, and invocation of the Holy Spirit, the Church brings creation and humanity before the Father and asks that the world may be sanctified and renewed. Eucharistic communion therefore cannot be separated from concern for the whole human family. As we celebrate the Eucharist, we are called to become instruments of God’s renewing grace, carrying the hope of Christ into the world through prayer, love, and service.", "s243": "Reconciled in the Eucharist, the members of the body of Christ are called to be servants of reconciliation among men and women and witnesses of the joy of resurrection. As Jesus went out to publicans and sinners and had table-fellowship with them during his earthly ministry, so Christians are called in the Eucharist to be in solidarity with the outcast and to become signs of the love of Christ who lived and sacrificed himself for all and now gives himself in the Eucharist.[71]", "s245": "The Eucharist sends us beyond the altar to become servants of reconciliation and witnesses of the joy of the Resurrection. As Christ welcomed sinners and the marginalized to His table on His earthly life, we too are called to reach out to those who are excluded, forgotten, or wounded. Our communion with Christ must become solidarity with others, especially with those who long for acceptance and dignity. In this way, the Eucharist becomes a living expression of Christ’s love, calling us to share with the world the reconciliation and new life we have received from Him.", "s247": "The very celebration of the Eucharist is an instance of the Church’s participation in God’s mission to the world. This participation takes everyday form in the proclamation of the Gospel, service of the neighbor, and faithful presence in the world.[72]", "s249": "The Eucharist sends the Church into the mission of God. What we celebrate at the altar mus
