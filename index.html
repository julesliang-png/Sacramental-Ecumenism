t become visible in our daily lives through the proclamation of the Gospel, service of our neighbors, and faithful presence in the world. Communion with Christ therefore becomes a call to participate in His mission and to bring His love into ordinary human circumstances. The Eucharist forms us not only as worshippers but also as witnesses and servants of Christ.", "s251": "As it is entirely the gift of God, the Eucharist brings into the present age a new reality which transforms Christians into the image of Christ and therefore makes them his effective witnesses. The eucharist is precious food for missionaries, bread and wine for pilgrims on their apostolic journey. The eucharistic community is nourished and strengthened for confessing by word and action the Lord Jesus Christ, who gave his life for the salvation of the world. As it becomes one people, sharing the meal of the one Lord, the eucharistic assembly must be concerned for gathering also those who are at present beyond its visible limits, because Christ invited to his feast all for whom he died. Insofar as Christians cannot unite in full fellowship around the same table to eat the same loaf and drink from the same cup, their missionary witness is weakened at both the individual and the corporate levels.[73]", "s253": "All Christians are invited to seek fuller unity in Christ. Reception of Holy Communion in the Catholic Church, however, follows the Church’s sacramental discipline and the conditions established by canon law. Like pilgrims receiving food for the road, we are strengthened to proclaim the Gospel not only through words but also through lives shaped by the love and self-giving of Christ. The Eucharistic community is also called to look beyond its visible boundaries and to welcome all whom Christ has invited to His table. Everyone is free to partake in Eucharistic communion. When Christians remain divided and cannot share fully in the one Eucharistic fellowship, the Church’s witness to the unity of Christ’s Body is weakened. Eucharistic communion therefore challenges us to seek deeper reconciliation among Christians, so that our common mission may more faithfully proclaim the one Lord who gave Himself for the salvation of all.", "s255": "The eucharistic liturgy is essentially a single whole, consisting historically of the following elements in varying sequence and of diverse importance: − hymns of praise; − act of repentance; − declaration of pardon; − proclamation of the Word of God, in various forms; − confession of faith (creed); − intercession for the whole Church and for the world; − preparation of the bread and wine; − thanksgiving to the Father for the marvels of creation, redemption and sanctification (deriving from the Jewish tradition of the berakah); − the words of Christ’s institution of the sacrament according to the New Testament tradition; − the anamnesis or memorial of the great acts of redemption, passion, death, resurrection, ascension and Pentecost, which brought the Church into being; − the invocation of the Holy Spirit (epiklesis) on the community, and the elements of bread and wine (either before the words of institution or after the memorial, or both; or some other reference to the Holy Spirit which adequately expresses the “epikletic” character of the eucharist); − consecration of the faithful to God; − reference to the communion of saints; − prayer for the return of the Lord and the definitive manifestation of his Kingdom; − the Amen of the whole community; − the Lord’s prayer; − sign of reconciliation and peace; − the breaking of the bread; − eating and drinking in communion with Christ and with each member of the Church; − final act of praise; − blessing and sending.[74]", "s257": "The Eucharistic liturgy gathers the whole mystery of Christian faith into one act of worship. From repentance and the proclamation of the Word to thanksgiving, anamnesis, epiclesis, communion, and final sending, every element leads the Church into deeper communion with Christ and with one another. The Eucharist is therefore not merely a collection of separate rites but one sacred movement of praise, remembrance, communion, and mission. Having received Christ at the table, the faithful are blessed and sent into the world to continue His work of love, reconciliation, and service.", "s259": "The best way towards unity in eucharistic celebration and communion is the renewal of the eucharist itself in the different churches regarding teaching and liturgy. The churches should test their liturgies in the light of the eucharistic agreement now in the process of attainment. The liturgical reform movement has brought the churches closer together in the manner of celebrating the Lord’s Supper. However, a certain liturgical diversity compatible with our common eucharistic faith is recognized as a healthy and enriching fact. The affirmation of a common eucharistic faith does not imply uniformity in either liturgy or practice. Since New Testament days, the Church has attached the greatest importance to the continued use of the elements of bread and wine which Jesus used at the Last Supper. In certain parts of the world, where bread and wine are not customary or obtainable, it is now sometimes held that local food and drink serve better to anchor the eucharist in everyday life. Further study is required concerning the question of which features of the Lord’s Supper were unchangeably instituted by Jesus, and which features remain within the Church’s competence to decide.[75]", "s261": "Eucharistic unity does not require every Church to celebrate the Eucharist in the same way. What is needed is a shared faith in the Eucharistic mystery, expressed through liturgies that may retain legitimate cultural and traditional diversity. Renewal should therefore lead the Churches toward deeper communion without demanding uniformity. The Eucharist can become a meeting point where the Churches recognize what they share, respectfully examine what still divides them, and continue discerning together how Christ’s institution is faithfully expressed in different contexts.", "s263": "In the celebration of the Eucharist, Christ gathers, teaches, and nourishes the Church. It is Christ who invites to the meal and who presides at it. He is the shepherd who leads the people of God, the prophet who announces the Word of God, the priest who celebrates the mystery of God. In most churches, this presidency is signified by an ordained minister. The one who presides at the eucharistic celebration in the name of Christ makes clear that the rite is not the assembly’s own creation or possession; the eucharist is received as a gift from Christ living in his Church. The minister of the Eucharist is the ambassador who represents the divine initiative and expresses the local community's connection with other local communities in the universal Church.[76]", "s265": "Christ remains the true presider of the Eucharist, gathering, teaching, and nourishing His Church. In the case of the Catholic Church, the ordained minister serves as a visible sign that the Eucharist is Christ’s gift rather than the possession of a particular congregation. Only a validly ordained bishop or priest can validly consecrate the Eucharist; the priest acts in the person of Christ the Head. Through this ministry, the local Eucharistic community is also reminded that it belongs to the wider communion of the Church. Thus, Eucharistic presidency expresses both communion with Christ and communion among the Churches, revealing that the Eucharist belongs to the whole Body of Christ.", "s267": "Christian faith is deepened by the celebration of the Lord’s Supper. Hence, the Eucharist should be celebrated frequently. Many differences of theology, liturgy, and practice are connected with the varying frequency with which the Holy Communion is celebrated.[77]", "s269": "The frequent celebration of the Eucharist continually strengthens the faith and communion of the Church. It reminds Christians that the Lord’s Supper is not an occasional devotion but a vital source of Christian life. Although Churches differ in how often they celebrate it, these differences can become an opportunity for deeper reflection on the central place of the Eucharist in the life of the whole Church.", "s271": "As the Eucharist celebrates the resurrection of Christ, it is appropriate that it should take place at least every Sunday. As it is the new sacramental meal of the people of God, every Christian should be encouraged to receive communion frequently.[78]", "s273": "The Sunday Eucharist gathers Christians around the mystery of Christ’s Resurrection and renews their identity as one people of God. Frequent participation in Holy Communion nourishes our faith, strengthens our communion with Christ, and deepens our communion with one another. The regular celebration of the Eucharist therefore sustains the Church in her journey of faith and mission. Catholics who are properly disposed and eligible to receive are encouraged to receive Holy Communion frequently.", "s275": "Some churches stress that Christ’s presence in the consecrated elements continues after the celebration. Others place the main emphasis on the act of celebration itself and on the consumption of the elements in the act of communion. The way in which the elements are treated requires special attention. Regarding the practice of reserving the elements, each church should respect the practices and piety of the others. Given the diversity in practice among the churches and at the same time taking note of the present situation in the convergence process, it is worthwhile to suggest: − that, on the one hand, it be remembered, especially in sermons and instruction, that the primary intention of reserving the elements is their distribution among the sick and those who are absent, and − on the other hand, it be recognized that the best way of showing respect for the elements served in the eucharistic celebration is by their consumption, without excluding their use for communion of the sick.[79]", "s277": "Christ remains really and substantially present under the consecrated species for as long as those species subsist; reservation and adoration outside Mass are therefore fitting. Christians should therefore approach these differences with respect and understanding rather than judgment. The reservation of the Eucharistic elements has long served the pastoral purpose of bringing Holy Communion to the sick, the elderly, and those unable to be present at the celebration. At the same time, the faithful should recognize that the Eucharist finds its fullest expression in the gathered community’s participation in the sacramental meal. Mutual respect for these practices can help Christians appreciate the richness of different traditions while remaining united in their reverence for the gift of Christ in the Eucharist.", "s279": "The increased mutual understanding expressed in the present statement may allow some churches to attain a greater measure of eucharistic communion among themselves and so bring closer the day when Christ’s divided people will be visibly reunited around the Lord’s Table.[80]", "s281": "Mutual understanding among Christians can become a path toward deeper Eucharistic communion. As the Churches continue to listen to one another, study their differences, and recognize the faith they already share, the divisions that separate them may gradually give way to greater communion. The hope of Christians is not simply to understand one another better, but ultimately to be visibly reunited around the one Table of the Lord. Such unity would become a powerful witness to Christ’s prayer that all His disciples may be one. Dialogue, shared prayer, and convergence do not by themselves establish full ecclesial communion, sacramental validity, or unrestricted intercommunion. Catholic sacramental sharing has carefully specified cases and conditions.", "s283": "ON MINISTRY", "s285": "In a broken world, God calls the whole of humanity to become God’s people. For this purpose, God chose Israel and then spoke uniquely and decisively in Jesus Christ, God’s Son. Jesus made his own the nature, condition, and cause of the whole human race, giving himself as a sacrifice for all. Jesus’ life of service, his death, and resurrection are the foundation of a new community which is built up continually by the good news of the Gospel and the gifts of the sacraments. The Holy Spirit unites in a single body those who follow Jesus Christ and sends them as witnesses into the world. Belonging to the Church means living in communion with God through Jesus Christ in the Holy Spirit.[81]", "s287": "The Church is God’s response to a broken humanity, gathered into one people through Jesus Christ and the power of the Holy Spirit. Christ’s life, service, death, and resurrection establish the foundation of this new community, while the Gospel and the sacraments continually nourish its life. To belong to the Church is therefore to live in communion with God and with one another through Christ in the Holy Spirit. This communion is never meant to remain inward-looking; the same Spirit who unites the Church also sends her members into the world as witnesses of Christ. The Church is thus both a community of communion and a community of mission, called to make visible God’s desire to gather humanity into one people.", "s289": "The life of the Church is based on Christ’s victory over the powers of evil and death, accomplished once for all. Christ offers forgiveness, invites to repentance, and delivers from destruction. Through Christ, people are enabled to turn in praise to God and in service to their neighbors. In Christ, they find the source of new life in freedom, mutual forgiveness, and love. Through Christ, their hearts and minds are directed to the consummation of the Kingdom where Christ’s victory will become manifest, and all things made new. God’s purpose is that, in Jesus Christ, all people should share in this fellowship.[82]", "s291": "The Church lives from the victory of Christ over sin, evil, and death. Through Him, believers receive forgiveness and new life and are called to respond through repentance, praise, service, and love. This communion is not merely a spiritual bond but a way of life in which Christians forgive one another and serve their neighbors while journeying toward the fullness of God’s Kingdom. Since God desires all people to share in this fellowship, the Church is continually challenged to overcome divisions and become a visible sign of the new humanity established in Christ.", "s293": "The Church lives through the liberating and renewing power of the Holy Spirit. That the Holy Spirit was upon Jesus is evidenced in his baptism, and after the resurrection, that same Spirit was given to those who believed in the Risen Lord to recreate them as the body of Christ. The Spirit calls people to faith, sanctifies them through many gifts, gives them strength to witness to the Gospel, and empowers them to serve in hope and love. The Spirit keeps the Church in the truth and guides it despite the frailty of its members.[83]", "s295": "The Holy Spirit continually renews the Church and gives life to the Body of Christ. Through the Spirit, believers are called to faith, sanctified by diverse gifts, strengthened to proclaim the Gospel, and empowered to serve in love and hope. The Spirit also preserves the Church in truth despite the weakness and limitations of its members. Therefore, the Church’s unity and mission do not depend solely upon human strength, but upon the Spirit who continually gathers, sanctifies, guides, and sends God’s people into the world.", "s297": "The Church is called to proclaim and prefigure the Kingdom of God. It accomplishes this by announcing the Gospel to the world and by its very existence as the body of Christ. In Jesus, the Kingdom of God came among us. He offered salvation to sinners. He preached good news to the poor, release to the captives, recovery of sight to the blind, liberation to the oppressed (Luke 4:18). Christ established a new access to the Father. Living in this communion with God, all members of the Church are called to confess their faith and to give an account of their hope. They are to identify with the joys and sufferings of all people as they seek to witness in caring love. The members of Christ’s body are to struggle with the oppressed towards that freedom and dignity promised with the coming of the Kingdom. This mission needs to be carried out in varying political, social, and cultural contexts. To fulfil this mission faithfully, they will seek relevant forms of witness and service in each situation. In so doing, they bring to the world a foretaste of the joy and glory of God’s Kingdom.[84]", "s299": "The Church is called not only to proclaim the Kingdom of God but also to make its presence visible through the life of the Body of Christ. Following Jesus, the Church must bring good news to the poor, stand with the oppressed, and defend the dignity and freedom of every person. Her mission therefore becomes a concrete witness of God’s Kingdom through faith, compassion, justice, and service. When Christians identify themselves with the joys and sufferings of humanity, they become signs of the hope and glory of the Kingdom already present in Christ and awaiting its fullness.", "s301": "The Holy Spirit bestows on the community diverse and complementary gifts. These are for the common good of the whole people and are manifested in acts of service within the community and to the world. They may be gifts of communicating the Gospel in word and deed, gifts of healing, gifts of praying, gifts of teaching and learning, gifts of serving, gifts of guiding and following, gifts of inspiration and vision. All members are called to discover, with the help of the community, the gifts they have received and to use them for the building up of the Church and for the service of the world to which the Church is sent.[85]", "s303": "The Holy Spirit equips the whole Church with diverse gifts for one common mission. No gift exists merely for personal benefit; each is given for the building up of the community and for service to the world. The Church therefore becomes stronger when every member discovers, develops, and faithfully uses the gifts entrusted by the Spirit. Diversity of gifts need not create division, but can become a source of communion when they are united in the service of Christ and the common good. In this way, the Church becomes a living Body in which every member has a place, a vocation, and a responsibility in the mission of God.", "s305": "Though the churches are agreed in their general understanding of the calling of the people of God, they differ in their understanding of how the life of the Church is to be ordered. In particular, there are differences concerning the place and forms of the ordained ministry. As they engage in the effort to overcome these differences, the churches need to work from the perspective of the calling of the whole people of God. A common answer needs to be found to the following question: How, according to the will of God and under the guidance of the Holy Spirit, is the life of the Church to be understood and ordered, so that the Gospel may be spread and the community built up in love?[86]", "s307": "The Church’s different traditions reveal both a shared calling and differing understandings of how that calling should be ordered. The question of ministry, therefore, should not be approached merely as a contest between ecclesial structures, but as a common discernment of how the Holy Spirit desires the Church to live and serve. Every form of ministry should contribute to the proclamation of the Gospel, the building up of the Christian community, and the growth of love. Ecumenical dialogue becomes fruitful when the Churches look beyond their institutional differences and ask together how their structures can better serve the one mission of Christ.", "s309": "The community that lives in the power of the Spirit will be characterized by a variety of charisms. The Spirit is the giver of diverse gifts which enrich the life of the community. In order to enhance their effectiveness, the community will publicly recognize certain of these charisms. While some serve permanent needs in the life of the community, others will be temporary. Men and women in the communities of religious orders fulfil a service which is of particular importance for the life of the Church. The ordained ministry, which is itself a charism, must not become a hindrance to the variety of these charisms. On the contrary, it will help the community to discover the gifts bestowed on it by the Holy Spirit and will equip members of the body to serve in a variety of ways.[87]", "s311": "The Holy Spirit enriches the Church through a diversity of charisms, given not only for particular moments but also for the continuing needs of the community. Sacramental ordained ministry is a hierarchical gift of the Spirit conferred through Holy Orders, distinct from the common priesthood and from personal charisms. Charismatic ministries are valuable but must be discerned in ecclesial communion and therefore should serve, recognize, and strengthen the gifts present among the whole people of God. Ministry becomes fruitful when it helps the community discern its gifts and equips its members for service rather than becoming a barrier to their participation. A healthy Church is therefore not one in which ministry replaces the charisms of the faithful, but one in which ordained ministry and the diverse gifts of the Spirit work together for the building up of the Body of Christ and its mission in the world.", "s313": "In the history of the Church, there have been times when the truth of the Gospel could only be preserved through prophetic and charismatic leaders. Often, new impulses could find their way into the life of the Church only in unusual ways. At times, reforms required a special ministry. The ordained ministers and the whole community will need to be attentive to the challenge of such special ministries.[88]", "s315": "The history of the Church shows that the Holy Spirit can raise prophetic and charismatic voices when the Gospel requires renewal, correction, or deeper fidelity. Such ministries may emerge outside ordinary structures, yet they can become instruments through which the Church rediscovers neglected dimensions of her calling. The ordained ministry and the wider community therefore need a spirit of discernment - neither rejecting unusual gifts simply because they are unfamiliar nor accepting every claim uncritically. True ecclesial discernment asks whether a particular ministry preserves the Gospel, strengthens communion, and leads the Church more faithfully into her mission. In this way, prophetic and ordained ministries need not compete; both can become instruments of the one Spirit who continually renews the Body of Christ.", "s317": "The apostles, as witnesses of the life and resurrection of Christ and sent by him, are the original transmitters of the Gospel, of the tradition of the saving words and acts of Jesus Christ, which constitute the life of the Church. This apostolic tradition continues through history and links the Church to its origins in Christ and in the college of the apostles. Within this apostolic tradition is an apostolic succession of the ministry that serves the continuity of the Church in its life in Christ and its faithfulness to the words and acts of Jesus transmitted by the apostles. The ministers appointed by the apostles, and then the episkopoi of the churches, were the first guardians of this transmission of the apostolic tradition; they testified to the apostolic succession of the ministry which was continued through the bishops of the early Church in collegial communion with the presbyters and deacons within the Christian community. A distinction should be made, therefore, between the apostolic tradition of the whole Church and the succession of the apostolic ministry.[89]", "s319": "The apostolic character of the Church is preserved through the continuing transmission of the Gospel and the faith handed down from the apostles. Apostolic tradition belongs to the whole Church, while apostolic succession in the strict ministerial sense is transmitted through Holy Orders to bishops in communion with the successor of Peter. This distinction allows the Church to appreciate both continuity and diversity in ministry without reducing apostolicity to institutional succession alone. The Church remains faithful to Christ when her ministries serve the living apostolic faith, preserve the Gospel, and strengthen communion among the whole people of God.", "s321": "Conclusion", "s323": "From the conception of the Church, unity is very important. The sacraments of Baptism, the Eucharist, and the definitive nature of ministry are vital in the Church’s life. But through the course of time, there were changes caused by divisions because of different interpretations of the Sacred Scriptures and the understanding of the message. Another factor was the nature of the society of that time. There were historical grievances that occurred. The goal of Sacramental Ecumenism is to accommodate the different understandings and put them into dialogue in the light of the Scriptures so that the Churches can find ways that will serve unity in the Church of Christ. The Catholic Church is not a member of WCC but an active observer. The Catholic Church can learn from BEM through observation and careful discernment. Although the Catholic Church is not a member of the WCC, Catholic theologians have participated fully in its Faith and Order Commission since 1968, including work on convergence texts such as BEM. BEM is not a declaration of the Catholic Magisterium.", "s325": "The Eucharist reveals both the gift and the wound of Christian division, for in the broken bread Christians recognize Christ’s presence while longing for the fullness of shared communion. Sacramental ecumenism begins with reverence for Christ already present in the worship of other Christians, acknowledging that grace precedes institutional reconciliation. Catholic teaching recognizes a valid Eucharist where valid Holy Orders and apostolic succession are preserved, particularly in Eastern Churches. Sacraments are encounters rather than possessions; they reveal God’s initiative to gather humanity into reconciliation beyond historical divisions. The broken bread becomes a prophetic sign, reminding Christians that division contradicts the very mystery they celebrate.", "s327": "Sacramental life invites believers into conversion, where participation in the mysteries of Christ transforms attitudes of exclusion into practices of hospitality and reconciliation. Shared longing can nourish already existing imperfect communion, without constituting full Eucharistic sharing. The sacramental imagination recognizes Christ present in Word, service, prayer, and community, preparing hearts for deeper ecclesial reconciliation. Sacramental ecumenism does not relativize doctrine but situates theological dialogue within lived encounter, where charity and truth advance together. The ultimate horizon of sacramental ecumenism is one Eucharistic table, where reconciled Christians celebrate the unity already willed by Christ for His Church. The emerging Koinonia: Unity and Justice initiative (KUJI) considers the BEM document (especially the precepts quoted for this paper) as worthy of being promoted in its ecumenical journey of dialogue and collaboration with different Churches. As its founder, BEM will be one of the foundational documents of KUJI to be used in its ecumenical venture in promoting Christian Unity."}, "zh": {"s003": "聖事大公主義是當今世界上為數不多的大公運動之一。第一次世界大戰之後，各教會開始聚集在一起，展開對話，並處理當時所發生的問題。這是各教會開始意識到必須以合一為目標的起點。一些基督新教教會及其他東正教教會聚集起來，於1948年成立了普世教會協會。1982年，普世教會協會的成員教會透過信仰與教制委員會，發表了《洗禮、聖餐與職事》（Baptism, Eucharist and Ministry，簡稱BEM）文件。BEM成為普世教會協會大公旅程中的指導因素。BEM並非天主教訓導權的教導，但在各教會的大公對話中具有重要意義。天主教會並不是普世教會協會的成員。隨著時間推移，天主教會並未保持孤立，而是向更新的召喚敞開自己，並體認到應當向大公主義開放。梵蒂岡第二屆大公會議隨之召開，歷任教宗也推動與其他教會的大公對話。", "s005": "聖事大公主義、BEM、聖事、聖洗、聖體聖事、職務", "s011": "論聖事大公主義：在基督徒合一的擘開之餅中與基督相遇", "s015": "引言", "s017": "聖洗建立了真實的聖事聯繫，雖然與天主教會的共融仍可能不完全。[1] 聖體聖事建立教會。[2] 那些保存了宗徒傳承、有效的聖秩聖事及有效的聖體聖事的東方教會，即使未與羅馬完全共融，仍是真正的個別教會。[3] 事實上，我們比自己所想的——甚至比我們敢於承認的——更接近合一。[4] 我們祈求：我們共同的聖洗，以及聖神在這台感恩祭中的行動，使我們彼此更加接近，並開始驅散那使我們彼此分離的可悲分裂。[5]", "s019": "教會作為聖事，本身一無所是，但在基督內卻是一切；祂自己才是真正的「萬民之光」（Lumen Gentium）。[6] 聖體聖事藉著堅固我們的合一，把我們結合成一個身體。這意味著基督的奉獻在每一台感恩祭中都被奉獻出來。在聖體聖事中，基督把祂的人性賜給我們，作為我們的滋養。[7] 禮儀是由天主的神聖子民與他們的主教一同舉行的。在有效的感恩祭中，藉著有效領受聖秩的主教或司鐸祝聖餅和酒，基督唯一的祭獻以聖事的方式臨現。主教座位是教會用以標示教會合一的代表性記號。[8] 完全的聖體共融仍是一個未來的目標，但願不會太遙遠。[9] 這樣的共融也預設了：與職務神學相關的種種問題與懸而未決的議題，都已獲得解決。[10]", "s021": "研究方法", "s023": "本研究採用質性的神學方法，結合文獻分析（針對BEM文件）、比較神學與教會性的反省。本研究檢視主要的聖事相關文獻——例如《教會憲章》（Lumen Gentium）、《禮儀憲章》（Sacrosanctum Concilium）、《天主教教理》、教宗的訓導及大公指引——以找出聖洗、聖體聖事與職務作為基督徒合一之基礎的核心原則。透過比較分析，天主教的教導與東正教及基督新教的聖事觀點展開對話，以突顯彼此的匯合之處與仍然存在的張力。本研究採用一種「共融的詮釋學」，將聖事詮釋為教會合一聖召的表達。此一進路使本研究得以把聖事大公主義同時評估為教義上的匯合，以及活出來的教會實踐。", "s025": "天主救恩的計畫，是要使萬有和眾人在基督內合而為一。[11] 主耶穌在升天以前，命令祂的門徒向全世界宣講福音，並為萬民施洗：「你們往普天下去，宣傳福音。[12] 天主教徒與基督新教徒在聖事數目上的分歧，唯有在各基督宗教團體之間，就「教會本身即是聖事」（重新）建立共識，才能獲得解決；在此共識之內，各項聖事才可能隨之恢復其應有的地位。[13] 因此，聖事大公主義並不是削減教義，而是重新發現教會作為和好之記號與工具的本質。[14]", "s027": "按照天主教的理解，有效的感恩祭以有效的聖秩聖事為前提。保存了宗徒傳承及有效聖體聖事的東方教會，應與缺乏聖秩聖事的教會團體有所區別。[15] 分離之痛本身就是一份恩寵，是走向更深的皈依、謙遜與對話的召喚。[16] 教會對聖體合一的渴望不是懷舊，而是對那等待著我們的圓滿共融所懷的希望。[17] 基督的祈禱「願眾人都合而為一」，在每一台感恩祭中迴響，召喚教會走向有形可見的合一（若17:21）。基督徒合一的未來在於聖體聖事——不是因為它很遙遠，而是因為它已經是一股隱藏的力量，在所有渴望共融並為共融而努力的人當中運行。[18]", "s029": "普世教會協會於1982年發表了一份名為《洗禮、聖餐與職事》的大公文件，作為成員教會的指引，幫助她們面對教會的根本生活，例如聖洗聖事、聖體聖事及教會的職務。這份文件提供了重要的大公觀點。以下是BEM的重要見解：", "s031": "《洗禮、聖餐與職事》（1982）", "s033": "普世教會協會是「一個教會的團契，這些教會依照聖經承認主耶穌基督為天主和救主，因而尋求共同完成她們共同的召叫，以光榮唯一的天主——父、子及聖神」（《章程》）。[19] 該協會努力活出其召叫，作為一個由不同傳統及宗派身分之教會所組成的團契。自召開並組成協會之時起，它便竭盡所能，將基督祈禱中的訓示「願眾人都合而為一」（若17:21）融入其體制之中。", "s035": "論聖洗", "s037": "基督徒的洗禮植根於納匝肋人耶穌的職務，植根於祂的死亡和祂的復活。洗禮是被納入基督內——祂是被釘死而又復活的主；洗禮是進入天主與天主子民之間的新盟約。洗禮是天主的恩賜，並因父、及子、及聖神之名而施行。[20]", "s039": "基督徒的聖洗是入門聖事中的第一件聖事。這件聖事為信者敞開門戶，使他們領受恩寵，成為天主的子女，並分享天主的國。", "s041": "聖洗之建立為入門聖事中的第一件聖事，也是通往其他聖事的門戶。基督徒的洗禮植根於納匝肋人耶穌的職務，植根於祂的死亡和祂的復活。洗禮是被納入基督內——祂是被釘死而又復活的主；洗禮是進入天主與天主子民之間的新盟約。洗禮是天主的恩賜，並因父、及子、及聖神之名而施行。聖瑪竇記載，復活的主在派遣門徒到世界上去時，命令他們施洗（瑪28:18-20）。宗徒時代的教會自最初的日子起便普遍施行洗禮，這在新約的書信、《宗徒大事錄》以及教父的著作中都有見證。今日的各教會延續這項實踐，作為向主委身的禮儀，而主則將祂的恩寵賜予祂的子民。[21]", "s043": "聖洗是基督徒旅程的開始，也是我們作為基督及其教會之肢體的身分的基礎。藉著水和至聖聖三，我們被納入基督的死亡與復活之中，並被迎入新盟約。聖洗作為天主的恩賜，藉著跟隨基督、按照祂的恩寵生活的共同召叫，使不同傳統的基督徒合而為一。因此，各教會蒙召承認聖洗不僅是進入基督徒生活的入門，也是共融的深厚泉源，提醒我們：凡受洗的人都屬於同一位主，並蒙召一同為福音作證。", "s045": "教會為所有呼求基督的人，以及為那些希望自己的子女被稱為基督徒的人施行聖洗聖事。聖洗是持守一個奉獻給基督及其教會之生命的門戶。這是一種身分：蒙召跟隨基督，並按照基督自己的榜樣修行德行。[22]", "s047": "聖洗聖事為新領洗者向基督徒的恩寵及救恩的泉源敞開。正是在這件聖事中，一個人領受了作為天父天主之子女及天主國繼承者的身分——成為天主家庭，即教會的正式成員。正是在這入門禮中，我們這些因至聖聖三之名受洗的人，在基督內成為弟兄姊妹，並分享基督的三重恩賜——司祭、先知與君王的使命。", "s049": "洗禮是藉著耶穌基督而得新生命的記號。洗禮使受洗者與基督及祂的子民結合。新約聖經和教會的禮儀以各種圖像展開洗禮的意義，這些圖像表達了基督的豐富和祂救恩的恩賜。這些圖像有時與舊約中水的象徵用法相連。洗禮是分享基督的死亡與復活（羅6:3-5；哥2:12）；是罪惡的洗淨（格前6:11）；是重生（若3:5）；是基督的光照（弗5:14）；是重新穿上基督（迦3:27）；是聖神的更新（鐸3:5）；是從洪水中得救的經驗（伯前3:20-21）；是脫離奴役的出谷（格前10:1-2）；也是被解放進入一個新人類，在其中，無論性別、種族或社會地位的分裂藩籬都被超越（迦3:27-28；格前12:13）。圖像雖多，實在卻是一個。[23]", "s051": "藉著聖洗，我們與基督同死。我們按照基督所許下的諾言，領受了新的人性。我們正與祂的身體——教會——結合，成為天國的分享者、喜訊的傳報者，以及一切來自天主之美善事物的教導者。我們在基督內是新受造物，注定要與基督永遠生活在一起，並與來自各種族、各語言、各文化和各民族的弟兄姊妹同在。", "s053": "洗禮意味著分享耶穌基督的生命、死亡和復活。耶穌下到約旦河裡，與罪人休戚與共而受洗，為完成全義（瑪3:15）。這洗禮使耶穌走上受苦僕人的道路，正如在祂的苦難、死亡和復活中所彰顯的（谷10:38-40、45）。藉著洗禮，基督徒被浸入基督那帶來解放的死亡中：在那裡，他們的罪被埋葬，「舊亞當」與基督同釘在十字架上，罪的權勢被粉碎。因此，受洗的人不再是罪的奴隸，而是自由的。他們完全與基督的死相結合，與祂同葬，並在此時此地藉著耶穌基督復活的德能復活於新生命，確信他們最終也將在一個與祂相似的復活中與祂合而為一（羅6:3-11；哥2:13、3:1；弗2:5-6）。[24]", "s055": "藉著聖洗，我們從罪中——從亞當的罪中——被洗淨，並在新亞當基督內成為新人。藉著基督的復活，我們懷有希望：按照我們所宣認的信仰，「肉身的復活及永恆的生命」，我們將要復活。祂在哪裡，我們也將在那裡，並分享祂的存有。我們將面對面地看見祂。天主將在基督內使我們自己的身體復活並受光榮。這是我們的希望。", "s057": "使基督徒分享基督死亡與復活奧蹟的洗禮，意味著承認罪過和內心的悔改。若翰所施的洗禮本身就是悔改的洗禮，為使罪得赦（谷1:4）。新約強調洗禮的倫理意涵，把洗禮描述為以清水洗滌身體的沐浴、洗淨內心一切罪污，以及成義的行動（希10:22；伯前3:21；宗22:16；格前6:11）。因此，受洗的人蒙基督赦免、潔淨並聖化，並在聖神的引導下，獲得一個新的倫理方向，作為他們洗禮經驗的一部分。[25]", "s059": "我們需要悔改，並渴望皈依——依照基督的榜樣，徹底地心靈回轉（metanoia）並改變生活方式。我們需要每天更新自己的生命，每天早晨成為新受造物，並在夜晚於天主面前承認自己的罪性。我們必須在生活中順從聖神的推動，並隨時準備好在世界的聖化中盡我們的一份力。", "s061": "聖神在人們受洗之前、受洗之時及受洗之後，都在他們的生命中工作。正是這同一位聖神，啟示了耶穌是聖子（谷1:10-11），並在五旬節賦予門徒力量、使他們團結（宗2）。天主將聖神的傅油和許諾賜給所有受洗的人，給他們蓋上印記，並在他們心中植下他們作為天主子女之產業的第一份憑證。聖神在他們心中培育信德的生命，直到最後的救贖，那時他們將進入對這產業的完全佔有，為頌揚天主的光榮（格後1:21-22；弗1:13-14）。[26]", "s063": "在基督的洗禮中，聖神降臨在祂身上。因此，這對我們這些受了洗、與祂同死的人是一個榜樣：聖神在我們的聖洗中降臨在我們身上，聖化我們，並啟發我們度基督徒的生活方式。同一位聖神使我們在教會的使命中合而為一，與我們在信仰中的弟兄姊妹保持團結。正是同一位聖神聖化我們，並啟發我們行善。正是聖神扶持我們在這世界上，作為天主所愛的子女而生活。", "s065": "洗禮是在服從我們的主之下施行的，是我們共同作門徒的記號和印記。藉著洗禮，基督徒被帶入與基督的結合、彼此之間的結合，以及與各時各地之教會的結合。我們共同的洗禮在信德中使我們與基督結合，因此是合一的基本聯繫。我們是一個民族，蒙召在每一處地方及在全世界宣認並事奉唯一的主。我們藉洗禮所分享的與基督的結合，對基督徒合一具有重要的意涵。「……只有一個洗禮，一個天主，就是眾人之父……」（弗4:4-6）。當洗禮的合一在唯一、至聖、至公、從宗徒傳下來的教會中實現時，便能為天主那治癒與修和的愛作出真正的基督徒見證。因此，我們進入基督的唯一洗禮，構成了對各教會的召喚，要她們克服分裂，並以有形可見的方式彰顯彼此的團契。[27]", "s067": "我們這些受了洗、被納入基督唯一身體——教會——的人，應當按照天主在基督內的旨意，同心同德地生活。但在現實中，我們分屬不同的宗派，有時對宗徒信仰的理解也各有不同。作為唯一身體——基督的教會——的肢體，我們蒙召走向合一（若17:21）與修和。基督徒彼此分裂，這是一個現實，從不同信仰宣認的存在便可看出。對我們基督徒而言，終極的召喚在於：我們如何能聚集在一起，並分辨那召喚，即基督為祂的門徒所作的祈禱：「願眾人都合而為一」（若17:21）。", "s069": "各教會無法彼此承認各自不同的洗禮實踐同屬唯一的洗禮，以及她們儘管相互承認洗禮卻仍實際分裂，這些都使教會破碎的見證變得極為顯而易見。某些地方和時期的教會，願意讓性別、種族或社會地位的差異分裂基督的身體，這進一步使基督徒團體真正的洗禮合一受到質疑（迦3:27-28），並嚴重損害了她的見證。恢復洗禮合一的需要，位於大公任務的核心，因為這對實現基督徒團體之間真正的夥伴關係至為關鍵。[28]", "s071": "目前仍有一些教會對來自其他教會的皈依者再次施洗。有效的聖洗不能重複施行；若存在嚴重疑慮，按照天主教法典，可能需要進行調查並施行附條件的聖洗。我們必須審慎分辨這方面的問題，以免使信仰的實踐成為絆腳石。", "s073": "洗禮開啟了在當今世界之中所賜予的新生命的實在。洗禮使人分享聖神的團體。它是天主國和來世生命的記號。藉著信、望、愛的恩賜，洗禮具有一種動力，涵蓋整個生命，延伸至萬民，並預示那一天的來臨：那時，萬舌都要宣認耶穌基督是主，以光榮天主聖父。[29]", "s075": "藉著聖洗的恩賜，我們分享基督在世界上的使命。我們擁有天主子女的身分，是在耶穌基督內信仰上的弟兄姊妹，也是基督使命的分享者——這使命是要拯救世界脫離罪惡的奴役與破碎。我們蒙召藉著渴望在基督耶穌內合而為一、成為天主的一個家庭，來彰顯這些實在，並且同心同德地合而為一。", "s077": "洗禮既是天主的恩賜，也是我們人對這恩賜的回應。洗禮指向成長，達到基督圓滿年齡的程度（弗4:13）。所有教會都承認：為領受在洗禮中所體現和勾勒的救恩，信德是必要的。為了在基督的身體內成為負責任的成員，個人的委身是必要的。[30]", "s079": "我們必須活出我們的身分。我們要在思想、言語和行為上，向世界表明我們是真正的基督徒。我們必須按照聖經的訓示生活，並效法基督的榜樣。藉著度理想的基督徒生活，我們向世界顯示天主是誰，以及祂為何把祂的獨生子派遣到世界上來。我們必須讓世界知道：我們都被一位慈愛的天主所愛。", "s081": "洗禮不僅關乎一時的經驗，也關乎一生在基督內的成長。受洗的人蒙召反映主的光榮，因為他們藉著聖神的德能被轉化，成為與主同樣的肖像，光榮上加光榮（格後3:18）。基督徒的生活必然是持續的奮鬥，但同時也是持續經驗恩寵的生活。在這新的關係中，受洗者為基督、為祂的教會、為祂所愛的世界而生活，同時在希望中等待天主新創造的顯現，以及天主成為萬物之中的萬有的時刻（羅8:18-24；格前15:22-28、49-57）。[31]", "s083": "我們的召叫是在這世界上耐心地生活。這是一個充滿不確定與挑戰的聖召。問題在於：「我們如何能按照基督要我們度的生活而生活？」有些日子我們滿懷靈感，但也有些日子平淡乏味。我們必須耐心地生活，並時時依靠來自天主的恩寵。聖神不會捨棄我們。只要我們把一切託付給祂，祂總會推動我們走向美善與神聖。我們終極的希望，是以我們整個的存在與天主同在。", "s085": "受洗的信者在基督徒的信仰生活中成長時，便顯示出人類能夠得到重生與解放。他們在此時此地負有共同的責任，要一同為基督——全人類的解放者——的福音作證。這共同見證的處境是教會和世界。在見證與服務的團契中，基督徒發現唯一的洗禮作為天主賜給祂全體子民之恩賜的完整意義。同樣，他們也承認，洗禮作為進入基督死亡的洗禮，具有倫理意涵：不僅要求個人的成聖，也推動基督徒在生活的各個領域中努力實現天主的旨意（羅6:9等；迦3:27-28；伯前2:21-4:6）。[32]", "s087": "受洗的人蒙召在世界上肖似基督。他們有責任為人類大家庭的救贖而工作——淨化文化、保護生命的神聖，並改善他人的生活。這是一項命令：要給飢餓的人吃，給赤身的人穿，醫治病人，陪伴孤獨的人，安慰憂苦的人，接納被遺棄的人，收容無家可歸的人，並啟迪無知的人。正是在從事天主的工作中，基督徒要使世界變得更好。", "s089": "雖然不能排除宗徒時代也曾施行嬰兒洗禮的可能性，但在新約文獻中，基於個人信仰宣認的洗禮是最清楚見證的模式。在歷史的進程中，洗禮的實踐發展出多種形式。有些教會為由父母或監護人帶來的嬰兒施洗，這些父母或監護人願意在教會內並與教會一起，在基督信仰中撫養孩子。其他教會則只為能夠親自宣認信仰的信者施洗。這些教會中有些鼓勵將嬰兒或孩童帶來，在一項禮儀中接受祝福；此禮儀通常包括為孩子這份恩賜感恩，以及父母承諾作基督徒父母。所有教會都為那些來自其他宗教或來自無信仰、接受基督信仰並參加要理講授的信者施洗。[33]", "s091": "然而，許多父母——其中大多數是天主教徒——在孩子受洗後的成長過程中，忽略了教導他們基督信仰，這並不是新近才有的體認。原因之一是父母自己就缺乏關於信仰的認識。這些父母中有許多來自千禧世代的天主教家庭。當孩子長大並接觸到其他信仰時，他們很容易就嘗試那新的信仰並接受再次受洗——同樣是因聖三之名的洗禮。這或許正是各教會之間需要對話的原因。", "s093": "信者的洗禮和嬰兒的洗禮，都是在作為信仰團體的教會內進行的。當一位能為自己作答的人受洗時，個人的信仰宣認將是洗禮禮儀不可或缺的一部分。當一名嬰兒受洗時，個人的回應將在生命較後的時刻作出。在這兩種情況下，受洗者都必須在對信仰的理解上成長。對於那些基於自己的信仰宣認而受洗的人，始終有一個持續的要求：個人在信仰中的回應要不斷成長。至於嬰兒，個人的宣認則期待於日後作出，而基督徒的培育便以引發這一宣認為方向。所有的洗禮都植根於並宣告基督至死不渝的忠信。洗禮的處境是在教會的生活與信仰之內，並透過整個教會的見證，指向天主的忠信——那是一切信仰生活的根基。在每一次洗禮中，全體會眾都重申自己對天主的信仰，並承諾提供一個見證與服務的環境。因此，洗禮應當始終在基督徒團體的處境中舉行並發展。[34]", "s095": "在天主教會內，嬰兒聖洗是慣常的做法。但藉著堅振聖事，受洗的孩子在領受堅振時能以信德作出回應。父母和堂區在堅振之前和之後，都在信仰中陪伴受洗者。教會應努力接觸各個家庭，尤其是那些不常到聖堂的家庭。基督徒應意識到自己的身分和責任，要把其他信者帶到教會來，好使他們也能在信仰上成長。門徒培育不只是基督新教的事，也必須在天主教的圈子中實踐。在堂區難以觸及的偏遠鄉間社區，應當推行基督徒基層團體。", "s097": "使用「嬰兒洗禮」和「信者洗禮」這兩個說法時，必須記住：真正的區別在於，一方為任何年齡的人施洗，另一方則只為能夠親自宣認信仰的人施洗。當人們認識到這兩種洗禮形式都體現了天主自己在基督內的主動，並表達了在信仰團體內所作的信德回應時，嬰兒洗禮與信者洗禮之間的差異便不再那麼尖銳。嬰兒洗禮的實踐強調團體的信仰，以及孩子與父母所共有的信仰。嬰兒誕生在一個破碎的世界，並分擔了它的破碎。藉著洗禮，福音的許諾與要求被加在孩子身上。受洗者的個人信仰以及忠實地參與教會生活，對於洗禮結出完滿的果實是不可或缺的。信者洗禮的實踐則強調當事人明確的宣認——他在信仰團體內並藉著信仰團體回應天主的恩寵，並尋求洗禮。兩種洗禮形式都要求對基督徒培育抱持相似而負責的態度。重新發現基督徒培育的持續性，或許能促進對不同入門實踐的相互接納。在一些結合了嬰兒洗禮與信者洗禮兩種傳統的教會中，已經能夠把以下兩種模式視為進入教會的同等選擇：一種是嬰兒時期受洗、日後再宣認信仰；另一種是嬰兒時期先被帶來接受奉獻與祝福、之後再領受信者洗禮。這個例子邀請其他教會判斷：她們在彼此的關係中以及在教會合併的協商中，是否也能承認同等的選擇。[35]", "s099": "兩種說法所指的洗禮實踐都值得肯定。嬰兒洗禮在天主教會和東正教會中都是普遍的做法，甚至在許多主流基督新教教會中也是如此。其他基督新教教會則施行成人洗禮。但我們應當坦誠地承認：在基督新教教會中，那些成人洗禮有許多有時其實是再洗禮，因為受洗者是來自其他教會的。", "s101": "洗禮是不可重複的行動。任何可能被解釋為「再洗禮」的做法都必須避免。那些堅持某種特定洗禮形式的教會，或那些對其他教會之聖事與職務的真實性存有嚴重疑問的教會，有時會要求來自其他教會傳統的人，在被接納為完全的領聖餐成員之前先受洗。隨著各教會彼此達到更完整的相互理解與接納，並在見證與服務上進入更密切的關係，她們將願意避免任何可能使其他教會的聖事完整性受到質疑，或可能削弱洗禮聖事之不可重複性的做法。[36]", "s103": "正如我已提到的，各教會之間應當就聖事進行對話。聖洗聖事的尊嚴應當受到研究，好使各教會能夠避免誤解，甚至不合規範的行為。再洗禮意味著其他教會的聖事是無效且不成立的，這影響到她們作為教會的完整性本身。有時，再洗禮甚至傳遞出一種「優越」心態的訊號。", "s105": "在天主的救恩工程中，基督死亡與復活的逾越奧蹟，與五旬節聖神的恩賜密不可分。同樣，分享基督的死亡與復活，與領受聖神密不可分。就其完整的意義而言，洗禮同時象徵並實現這兩者。基督徒對於聖神恩賜的記號究竟何在，看法各有不同。不同的禮儀行動已與賜予聖神相連結。對某些人而言，那就是用水的禮儀本身；對另一些人而言，那是用聖化聖油的傅油及／或覆手，許多教會稱之為堅振；還有一些人則認為三者皆是，因為他們看見聖神在整個禮儀中運行。所有人都同意：基督徒的洗禮是在水和聖神內的。[37]", "s107": "聖洗將基督死亡與復活的奧蹟，與聖神的恩賜結合在一起。雖然各基督宗教傳統在如何表達藉著水、傅聖油或覆手而領受聖神方面有所不同，但都被吸引進入在基督和聖神內的唯一聖洗奧蹟。這些差異邀請各教會承認她們所共享的共同恩寵，同時繼續加深對基督徒入門聖事的理解。", "s109": "在某些傳統中，人們解釋說：正如洗禮使我們與被釘、被埋葬並復活的基督相似，同樣，基督徒藉著傅聖油從受傅的聖子那裡領受五旬節聖神的恩賜。如果洗禮作為被納入基督的身體，就其本質而言指向分享基督的聖體聖血，那麼便產生一個問題：在洗禮和准許領聖體之間，怎能插入另一個獨立的禮儀？那些為兒童施洗、卻在這樣的禮儀之前拒絕讓他們分享聖餐的教會，或許應當思考：她們是否已充分體認並接受了洗禮的後果。洗禮需要不斷地重新確認。這種重新確認最明顯的形式，就是舉行聖餐。重宣領洗誓願也可以在諸如每年慶祝逾越奧蹟的時機，或在他人受洗時進行。[38]", "s111": "聖洗、堅振和聖體聖事不應被理解為彼此孤立的實在，而應被理解為進入基督的唯一基督徒入門過程中的各個環節。如果聖洗使我們被納入基督的身體，那麼聖體聖事便自然成為這生命的滋養。這引出了一個重要的大公問題：我們圍繞入門聖事的不同做法，是否有時遮蔽了已在聖洗中賜予的共融？藉著聖體聖事不斷更新領洗的身分，提醒我們：基督徒的生活不是單一的入門時刻，而是持續地分享基督的死亡、復活和生命。在這個意義上，聖體聖事不斷地把受洗的人聚集到基督所祈求的共融之中。", "s113": "邁向洗禮的相互承認。各教會越來越承認彼此的洗禮是進入基督的唯一洗禮，只要候洗者已宣認耶穌基督為主；或者，在嬰兒洗禮的情況下，只要教會（父母、監護人、代父母及會眾）已作出宣認，並在日後由個人的信仰與委身加以確認。洗禮的相互承認被公認為一個重要的記號和途徑，用以表達在基督內所賜予的洗禮合一。只要可能，各教會都應明確地表達這種相互承認。[39]", "s115": "值得肯定的是，如果聖洗的經文是聖三的，並且是以水、以候洗者或團體的真誠意向而適當地施行。有時，在異宗婚姻甚至加入其他教會時，教會領袖會要求候洗者再次受洗。當各教會採納洗禮的相互承認時，她們便避免了惡表。這或許不能稱為「惡表」，但看來是一種在聖洗聖事之靈性規範方面的規則上的不合規範。", "s117": "為了克服彼此的差異，信者洗禮的支持者和施行嬰兒洗禮的人，都應重新考慮自己實踐中的某些方面。前者或許可以更明顯地表達一個事實：兒童是被置於天主恩寵的保護之下的。後者則必須防範看似不加分辨的洗禮實踐，並更認真地看待自己的責任，培育受洗的兒童達致對基督成熟的委身。[40]", "s119": "兩種傳統都被邀請以謙遜和開放的態度檢視自己的實踐。施行信者洗禮的人可以更加關注兒童在天主恩寵中的地位，而施行嬰兒洗禮的人則被提醒：他們有責任培育受洗的兒童，使之達致成熟的信仰和對基督的委身。當每個傳統都願意承認對方能教導自己的事時，大公對話便能結出果實。如此，聖洗所成為的不是分裂的理由，而是一份邀請，邀請人在基督內達到更深的相互理解與共融。", "s121": "洗禮是以水，因父、及子、及聖神之名而施行的。在舉行洗禮時，水的象徵層面應受到認真對待，而不應被淡化。浸入的行動能生動地表達這一實在：在洗禮中，基督徒分享基督的死亡、埋葬和復活。正如在一些神學傳統中所見，用水——連同其所有與生命和祝福相關的正面聯想——象徵舊創造與新創造之間的連續性，從而揭示洗禮不僅對人類、也對整個宇宙所具有的意義。同時，用水也代表受造界的潔淨，即向世上那些消極和破壞性的事物死去：那些受洗進入基督身體的人，便成為更新之存在的分享者。[41]", "s123": "其他一些教會並不使用聖三的經文。可能的情況是，當這些教會或教會團體的成員再次受洗時，他們必須以有效的方式被接納進入這件聖事。但即便如此，受洗者的決定仍應出於良心。若有效性存疑，有權的施行人必須按照教會法調查原先的禮儀；聖洗不只是個人的偏好，而應按照教會的規範施行。", "s125": "正如最初幾個世紀的情形，洗禮中聖神的恩賜也可以另外藉著其他記號來表示，例如覆手的記號，以及傅油或傅聖油。十字聖號本身就提醒人想起所許諾的聖神恩賜；聖神是那尚未來臨之事的首期與保證——那時，天主將完全救贖祂所據為己有的人（弗1:13-14）。重新恢復這些生動的記號，可望豐富禮儀。[42]", "s127": "聖洗中聖神的恩賜提醒我們，天主的恩寵是藉著教會的生活和敬禮而顯明的。覆手、傅油、傅聖油和十字聖號，都指向聖神在受洗者身上的臨在與工作。這些神聖的記號幫助信友更深地理解他們所慶祝的奧蹟，並提醒他們：聖洗是一生成聖旅程的開始。因此，恢復這些生動的記號能夠豐富禮儀，並在信友心中喚起對在聖洗中所領受之聖神恩賜更深的珍視。", "s129": "在任何完整的洗禮禮規中，至少應包含以下要素：宣讀與洗禮有關的聖經；呼求聖神；棄絕邪惡；宣認對基督和至聖聖三的信仰；用水；宣告受洗者已獲得新的身分，成為天主的子女和教會的成員，蒙召為福音作證。有些教會認為，若受洗者沒有以聖神的恩賜受印，並參與聖餐，基督徒入門便不算完整。[43]", "s131": "聖洗把天主的聖言、聖神、信德、水以及棄絕邪惡，結合在一個深刻的基督徒入門行動之中。藉著這件聖事，受洗者領受了作為天主子女和教會成員的新身分。這身分不僅是一項特恩，也是一份責任：要成為福音的見證人，並按照所領受的信仰生活。聖神的恩賜不斷堅固受洗者，而參與聖體聖事則滋養他們與基督以及彼此之間的共融。因此，基督徒入門引領我們進入一生信仰、聖德與服務的旅程，在其中，於聖洗中所領受的恩寵在教會的生活和世界中持續結出果實。", "s133": "在洗禮禮儀的處境中，適宜解釋聖經中所呈現的洗禮意義（即：分享基督的死亡與復活、悔改、赦免與潔淨、聖神的恩賜、被納入基督的身體，以及天國的記號）。[44]", "s135": "聖洗意義豐富，因為它使受洗者與基督的整個奧蹟以及教會的生活結合在一起。藉著分享基督的死亡與復活，我們蒙召悔改，領受寬恕與潔淨，並被聖神更新。藉著聖洗，我們被納入基督的身體，並成為教會生活的分享者。聖洗也是天國的記號，提醒我們：在基督內所領受的新生命，是指向與天主圓滿的共融。更深入地理解這些意義，能幫助受洗者珍視他們所領受的恩寵，並更忠實地按照自己作為基督肢體及祂福音見證人的身分生活。", "s137": "近來的討論指出，應當更加關注由洗禮所處的社會文化背景所助長的誤解。(a)在世界某些地區，在洗禮禮儀中取名，導致洗禮與圍繞取名的習俗混淆。如果在主要不是基督宗教的文化中，要求受洗者採用不植根於其文化傳統的基督徒名字，這種混淆尤其有害。各教會在制定洗禮規定時，應謹慎地把重點放在洗禮真正的基督徒意義上，並避免因強加外來名字而不必要地使受洗者與其本地文化疏離。一個從自己原本文化根源繼承而來的名字，在那文化中的受洗者，同時也彰顯洗禮的普世性，即被納入那遍及地上萬民的唯一、至聖、至公、從宗徒傳下來的教會。(b)在許多歐洲和北美的大型多數派教會中，嬰兒洗禮常以看似不加分辨的方式施行。這使得施行信者洗禮的教會更不願承認嬰兒洗禮的有效性；這一事實應促使那些多數派教會本身，對洗禮的意義作更具批判性的反省。(c)一些非洲教會藉著覆手施行不用水的聖神洗禮，同時承認其他教會的洗禮。需要就此一實踐及其與用水之洗禮的關係進行研究。[45]", "s139": "舉行聖洗時，必須對領受者的文化、傳統和處境保持敏感。教會的普世性並不要求受洗者放棄自己的文化身分；相反，聖洗把每一種文化都迎入基督唯一的身體。因此，各教會有責任區分聖洗的本質意義，與那些可能引起混淆或不必要地使人與其文化傳承疏離的做法。同時，每一個基督宗教傳統都必須誠實地檢視自己的實踐，並保持開放，向他人的經驗學習。我們在基督徒入門方式上的差異，應當邀請人作更深的反省，而不是立即的評斷。如此，聖洗才能真正成為教會至公性的記號，使不同文化和傳統的民族在基督內被聚集於一個共融之中。", "s141": "洗禮通常由受過按立的職務人員施行，但在某些情況下，也允許其他人施洗。由於洗禮與教會的團體生活和敬禮密切相連，它通常應在公開的敬禮中施行，好使會眾成員能想起自己的洗禮，並把受洗者——他們承諾要在基督信仰中培育的人——迎入他們的團契之中。這件聖事適合在重大的節慶時機舉行，例如復活節、五旬節和主顯節，正如初期教會的做法。[46]", "s143": "聖洗不是私人的慶典，而是被納入教會這個敬禮與生活的團體之中。當這件聖事在會眾面前舉行時，受洗者便被迎入一個團體，這團體承擔起在基督信仰中陪伴並培育他或她的責任。同時，會眾也被提醒想起自己的聖洗，並在以基督內唯一身體而生活的召叫中得到更新。在復活節、五旬節和主顯節等重大慶節舉行聖洗，也把這件聖事與基督信仰的核心奧蹟連結起來：基督的復活、聖神的恩賜，以及基督向世界的顯現。因此，聖洗不僅使新領洗者與基督結合，也使他們與祂的子民結合；在那裡，信仰在與他人的共融中被領受、滋養、慶祝和活出來。", "s145": "論聖體聖事", "s147": "教會從主那裡領受聖餐，作為一份恩賜。聖保祿寫道：「我從主所領受的，也傳授給你們了：主耶穌在祂被交付的那一夜，拿起餅來，祝謝了，擘開說：『這是我的身體，為你們而捨的。你們應這樣行，為紀念（anamnesis）我。』晚餐後，又同樣拿起杯來說：『這杯是用我的血而立的新約；你們每次喝，應這樣行，為紀念我。』」（格前11:23-25；參閱瑪26:26-29；谷14:22-25；路22:14-20）。記載中耶穌在世職務期間與人分享的那些餐食，宣告並實現了天國的臨近，而增餅餵飽群眾正是其記號。在祂最後的晚餐中，天國的團契與耶穌即將來臨的苦難相連。復活之後，主在擘餅時讓門徒認出祂的臨在。因此，聖餐延續了耶穌在世生活期間及復活之後的這些餐食，始終是天國的記號。基督徒看到聖餐預象於以色列紀念從為奴之地被拯救的逾越節，以及西乃山上的盟約之宴。它是教會新的逾越晚餐，是新約的晚餐，是基督賜給祂門徒，作為祂死亡與復活的紀念（anamnesis），作為羔羊婚宴的預嘗（默19:9）。基督命令祂的門徒，作為延續不斷的天主子民，在這聖事性的晚餐中如此紀念祂並與祂相遇，直到祂再來。耶穌所舉行的最後晚餐，是一個運用象徵性言語和行動的禮儀性餐宴。因此，聖餐是一個聖事性的餐宴，藉著有形可見的記號，把天主在耶穌基督內的愛傳達給我們——就是耶穌愛自己的人「愛他們到底」的那份愛（若13:1）。它有許多名稱，例如：主的晚餐、擘餅、聖體共融、神聖禮儀、彌撒。它的舉行延續為教會敬禮的核心行動。[47]", "s149": "聖體聖事是基督持續賜給祂教會的恩賜，藉此我們紀念、相遇並宣告祂死亡與復活的奧蹟。在感恩祭中，教會作為新約的子民聚集，領受基督的愛——祂為了世界的救恩完全交付了自己。因此，聖體聖事不只是對過去某一事件的回憶，而是與基督生活的相遇，也是對天國圓滿的預嘗。當來自不同傳統的基督徒圍繞著主的晚餐這奧蹟聚集時，聖體聖事的許多名稱和禮儀表達提醒我們基督宗教傳統的豐富，同時指向我們所宣告的唯一基督。既然聖體聖事位於教會敬禮的中心，它也召叫我們加深與基督以及彼此之間的共融，好使教會越來越成為基督所祈求之合一的有形可見的記號。", "s151": "聖餐本質上是天主藉著聖神的德能、在基督內賜予我們之恩賜的聖事。每一位基督徒都藉著在基督的身體和血內的共融，領受這救恩的恩賜。在聖餐的晚餐中，在吃餅喝酒之中，基督賜予與祂自己的共融。天主親自行動，賦予基督的身體生命，並更新每一個肢體。按照基督的許諾，基督身體的每一位受洗肢體，都在聖餐中領受罪得赦免的保證（瑪26:28）和永生的憑證（若6:51-58）。雖然聖餐本質上是一個完整的行動，這裡將從以下幾個方面來探討：向聖父感恩、紀念基督、呼求聖神、信友的共融、天國的晚餐。[48]", "s153": "聖體聖事是基督藉著聖神的德能賜給祂教會的生活的恩賜。聖體聖事增強愛德並赦免小罪，但並非為赦免死罪而設。意識到自己犯有重罪的天主教徒，通常應在領聖體之前先領受聖事性的赦罪。聖體聖事把向聖父的感恩、對基督死亡與復活的紀念、呼求聖神、信友的共融以及對天國的預嘗結合在一起。這些實在並非彼此分離，而是構成一個共融的奧蹟。當我們領受基督的聖體聖血時，我們不斷被天主的恩寵更新，並被堅固，得以在基督內作為一個民族而生活。因此，聖體聖事召叫我們超越個人的熱心，走向一種在愛、服務和整個教會的合一中所表達的更深的共融。但這並不意味著：在天主教會看來，所有基督徒的聖餐都是有效的。並非每一位受洗的基督徒都可以從天主教會領受聖體。", "s155": "聖餐總是包括聖言和聖事，是對天主工程的宣告和慶祝。它是向聖父所獻上的偉大感恩：為了在創造、救贖和聖化中所完成的一切，為了儘管人有罪、天主如今仍在教會和世界中所完成的一切，也為了天主在使天國達於圓滿時將要完成的一切。因此，聖餐是讚頌（berakah），教會藉此表達她對天主一切恩惠的感謝。[49]", "s157": "聖體聖事教導教會成為一個感恩的民族。在人生的祝福與掙扎之中，我們聚集起來承認：我們所擁有的一切終究來自天主，而祂的救恩工程在創造、救贖和聖化中持續進行。即使世界被人的罪所傷害，教會仍繼續感恩，因為天主始終忠信，並持續為實現祂的國而工作。因此，聖體聖事塑造我們的心，使我們不僅在喜樂的時刻，也在痛苦和不確定之中，認出天主的美善。當我們一同感恩時，我們被提醒：我們屬於天主的同一個子民，蒙召懷著感恩領受祂的恩賜，並成為祂在世界上之愛與慷慨的工具。", "s159": "聖餐是偉大的讚美之祭，教會藉此代表整個受造界發言。因為天主所和好的世界臨在於每一次聖餐中：在餅和酒中，在信友的身上，也在他們為自己和為眾人所獻的祈禱中。基督使信友與祂自己結合，並把他們的祈禱納入祂自己的轉求之中，好使信友被轉化，他們的祈禱被悅納。這讚美之祭唯有藉著基督、偕同基督、在基督內才有可能。餅和酒——大地和人類勞苦的果實——在信德和感恩中被呈獻給聖父。因此，聖餐象徵世界將要成為的樣子：向造物主的奉獻和讚美詩、在基督身體內的普世共融、在聖神內的正義、仁愛與和平的國度。[50]", "s161": "聖體聖事是整個教會的讚美之祭，是藉著基督、偕同基督、在基督內而奉獻的。在餅和酒中，大地的果實和人手的勞苦被帶到聖父面前，而信友的祈禱則與基督的轉求相結合。因此，聖體聖事不僅聚集受洗的人，而且在一個深刻的意義上，把整個受造界聚集到向天主的感恩奉獻之中。當我們參與這奧蹟時，我們也蒙召成為我們所慶祝的：一個被基督轉化、成為正義、仁愛與和平之工具的民族。聖體聖事提醒我們，與基督的共融不能只局限於禮儀的舉行；它必須成為一種生活方式，使基督徒藉此一同為世界的更新和天主國的來臨而努力。", "s163": "聖餐是被釘死而又復活之基督的紀念，即祂祭獻的生活而有效的記號；這祭獻已在十字架上一次而永遠地完成，並仍然為全人類發揮作用。應用於聖餐的聖經中的「紀念」觀念，指的是天主的子民在禮儀中舉行時，天主工程的這一當下的效力。[51]", "s165": "聖體聖事使基督死亡與復活的救恩奧蹟臨現於教會。我們所慶祝的紀念不僅是對過去發生之事的回憶，而是生活地分享基督的救贖工程——祂的祭獻持續為人類結出果實。每當教會圍繞聖體的餐桌聚集時，信友便被引入這奧蹟之中，並被提醒：十字架與復活的恩寵在他們的生命中依然活躍。藉著這紀念，基督不斷更新祂的子民，並召叫他們按照祂為他們所成就的新生命而生活。因此，聖體聖事在對基督救贖之愛的一個慶典中，把過去、現在和未來的希望結合在一起。", "s167": "基督親自，連同祂為我們和為整個受造界所完成的一切（在祂的降生成人、僕人身分、職務、教導、苦難、祭獻、復活、升天，以及派遣聖神之中），臨在於這紀念（anamnesis）之中，賜予我們與祂自己的共融。聖餐也是祂再臨（Parousia）和末世之國的預嘗。[52]", "s169": "在聖體聖事中，基督帶著祂救贖工程的圓滿臨在於祂的教會。祂的降生成人、職務、苦難、死亡、復活、升天以及派遣聖神，並不是與信友生活相隔的遙遠事件，而是基督藉以不斷吸引我們進入與祂共融的奧蹟。因此，聖體聖事使我們與基督的整個奧蹟結合，並提醒我們：我們的基督徒生活植根於祂完全自我交付的愛。同時，聖體聖事引導我們的心朝向未來，使我們預嘗基督的來臨和祂國度的圓滿。當我們在當下領受基督時，我們被堅固，得以忠信地生活，等待祂的國完全顯現的那一天。", "s171": "基督藉著祂教會喜樂的慶祝而在其中行動的紀念（anamnesis），因此既是重現，也是預嘗。它不只是回想過去之事及其意義，而是教會對天主大能作為和許諾的有效宣告。[53]", "s173": "聖體聖事不僅是紀念天主過去所完成的事，更是對祂救恩工程和祂許諾的喜樂宣告。藉著紀念（anamnesis），教會慶祝天主的大能作為，使之臨現於信友的生活中，同時預嘗它們在天國中的圓滿實現。因此，每一台感恩祭都成為一個宣告的行動：教會紀念基督，在當下與祂相遇，並滿懷信心地宣告祂來臨的希望。在舉行感恩祭時，我們成為一個不斷宣告所領受之信仰、並為天主在基督內所完成之救恩作證的民族。", "s175": "重現與預嘗在感恩與轉求中表達出來。教會懷著感激回想天主救贖的大能作為，懇求天主把這些作為的恩惠賜給每一個人。在感恩與轉求中，教會與聖子——她偉大的大司祭和轉求者——結合（羅8:34；希7:25）。聖餐是基督唯一祭獻的聖事，祂永遠活著為我們轉求。它是天主為世界的救恩所做一切的紀念。天主願意在基督的降生成人、生活、死亡、復活和升天中所完成的，天主不會重複。這些事件是獨一無二的，既不能重複，也不能延長。然而，在聖餐的紀念中，教會在與我們偉大的大司祭基督的共融中，獻上她的轉求。[54]", "s177": "聖體聖事把教會聚集到我們偉大的大司祭基督的感恩與轉求之中。當我們懷著感激紀念天主的救恩工程時，我們也被推動為整個人類大家庭的需要祈禱。教會並不重複基督唯一的祭獻，因為祂的降生成人、苦難、死亡、復活和升天，是為了世界的救恩而一次發生的。相反地，在聖體聖事的紀念中，我們分享復活基督持續不斷的轉求——祂不斷把祂的子民帶到聖父面前。因此，聖體聖事教導我們：與基督共融，也意味著成為一個感恩、為他人轉求、並把人類的希望與苦難帶到天主臺前的民族。", "s179": "正是在聖餐作為轉求的意義之光照下，天主教神學中將聖餐稱為「贖罪祭」（propitiatory sacrifice）的說法才能被理解。其理解是：只有一個補贖，就是十字架上唯一祭獻的補贖；它在聖餐中成為現實，並在基督和教會為全人類所作的轉求中被呈獻於聖父面前。按照聖經的紀念觀念，所有教會或許都願意重新檢視有關「祭獻」的舊有爭議，並加深理解：為什麼與自己不同的其他傳統，或使用、或拒絕了這個詞語。[55]", "s181": "聖體聖事邀請基督徒以謙遜和更深的理解來接近祭獻的奧蹟。基督的祭獻是獨一無二且圓滿的，為了世界的救恩一次而完成；而在彌撒中，同一個祭獻以聖事的方式臨現；教會藉著基督、偕同基督、在基督內參與這奉獻。基督宗教的不同傳統發展出不同的方式來表達她們對這奧蹟的理解，而這些差異有時成為分裂的根源。我們不應讓舊有的爭議繼續使基督徒分離，而應彼此尊重地聆聽，並設法理解為什麼某些傳統保留了祭獻的語言，而另一些傳統則對使用這語言有所遲疑。透過真誠的對話、祈禱，以及對聖經和基督宗教傳統更深入的研究，各教會或許會發現：那曾使她們分裂的，也能成為一個契機，使她們在對基督唯一救贖祭獻的理解上一同成長。", "s183": "基督的紀念（anamnesis）是一切基督徒祈禱的基礎和泉源。因此，我們的祈禱依賴於、並結合於復活之主持續不斷的轉求。在聖餐中，基督賦予我們能力，使我們作為成義的罪人與祂一同生活、與祂一同受苦、藉著祂祈禱，喜樂而自由地承行祂的旨意。[56]", "s185": "聖體聖事教導我們：基督徒的祈禱總是與基督的祈禱結合在一起。藉著紀念（anamnesis），我們被引入復活之主持續不斷的轉求之中，並學習藉著祂把我們的喜樂、痛苦、希望和掛慮獻給聖父。在聖體聖事中領受基督時，我們不僅被堅固得以與祂一同生活，也得以與祂一同受苦，並以自由和喜樂承行祂的旨意。因此，聖體聖事把祈禱從個人的行動轉化為與基督及整個教會共融的行動。當我們藉著基督祈禱時，我們也學會把弟兄姊妹的需要帶到天主面前，並使我們自己的生命成為服務他人的愛的奉獻。", "s187": "在基督內，我們在日常生活中把自己獻上，作為生活而聖潔的祭品（羅12:1；伯前2:5）；這蒙天主悅納的屬靈敬禮，在聖餐中得到滋養；在聖餐中，我們在愛內被聖化並得到修和，好在世界上作修和的僕人。[57]", "s189": "聖體聖事滋養我們，使我們把整個生命獻給天主，作為生活的祭品。藉著與基督的共融，我們在祂的愛內被聖化並得到修和，而這修和應當在我們與他人相處的方式中顯明出來。我們若對周遭的創傷與分裂漠不關心，便不能真正領受基督的恩賜。因此，聖體聖事從禮儀中派遣我們出去，作修和的僕人，蒙召把治癒、和平與愛帶入我們的家庭、團體、教會和社會之中。在偕同基督奉獻自己時，我們的日常生活成為聖體奧蹟的延伸，天主的愛藉此繼續觸及世界。", "s191": "與我們的主結合，並與所有聖人和殉道者共融，我們在基督的血所印證的盟約中得到更新。[58]", "s193": "聖體聖事不僅使我們與基督結合，也使我們與那些始終忠於祂的諸聖相通結合。在慶祝這奧蹟時，我們記起：教會是一個跨越世代、文化和處境而聚集的民族，因基督的血所印證的唯一盟約而合而為一。聖人和殉道者的見證提醒我們，與基督的共融要求忠信、犧牲和堅忍。當我們參與聖體聖事時，我們在這盟約中得到更新，並被堅固，得以繼續同一條信仰的旅程，與基督及祂的全體子民保持合一。", "s195": "既然基督的紀念（anamnesis）是所宣講之聖言的真正內容，正如它也是聖餐之晚餐的內容，二者便彼此加強。聖餐的舉行理當包括聖言的宣講。[59]", "s197": "在教會的生活中，天主的聖言與聖體聖事密不可分。藉著宣讀聖經，基督向祂的子民說話，並準備他們在聖體奧蹟中與祂相遇。聖言滋養我們的信德，而聖體聖事則使聖言所宣告的救恩奧蹟成為與基督共融的生活慶典。二者都不應彼此分離，因為兩者所宣告並使之臨現的，是天主同一個救恩工程。當基督徒聆聽聖言並分享聖體聖事時，他們不斷被塑造為一個民族，在信德中得到堅固，並被派遣到世界上為福音作證。", "s199": "基督在建立聖餐時的言語和行動，位於這慶典的核心；聖餐的晚餐是基督身體和血的聖事，是祂真實臨在的聖事。基督以多種方式實踐祂的許諾：要常與祂的人同在，直到世界的終結。但基督在聖餐中的臨在方式是獨一無二的。耶穌在聖餐的餅和酒上說：「這是我的身體……這是我的血……」基督所宣告的是真實的，而這真理在每次舉行聖餐時都得以實現。教會宣認基督在聖餐中真實、生活而主動的臨在。雖然基督在聖餐中的真實臨在並不取決於個人的信仰，但大家都同意：要分辨基督的身體和血，信德是必需的。許多教會相信，藉著耶穌的話語和聖神的德能，聖餐的餅和酒以一種真實而奧秘的方式，成為復活基督的身體和血，即在祂一切圓滿中臨在的生活的基督。在餅酒的記號之下，最深的實在是基督的整個存有，祂來到我們這裡，餵養我們，並轉化我們整個的存在。其他一些教會雖然肯定基督在聖餐中的真實臨在，卻沒有把這臨在如此明確地與餅酒的記號連結起來。這一差異能否被容納於文本本身所表述的匯合之中，仍有待各教會決定 [60]", "s201": "在有效的祝聖時，餅和酒的整個實體轉變為基督的聖體和聖血：這就是質變。在基督建立聖體聖事時的言語和行動中，我們與祂身體和血的奧蹟相遇，也與祂常在祂子民中間的許諾相遇。雖然各教會在如何解釋基督臨在於聖體記號中的方式上或許有所不同，但所有基督徒都蒙召以信德、敬畏和謙遜來接近這奧蹟。聖體聖事不只是神學討論的對象，而是與生活的基督相遇——祂來滋養並轉化祂的子民。如果我們真正在聖體奧蹟中分辨出基督，我們與祂的共融也應引領我們走向彼此之間更大的共融。因此，基督徒之間在聖體聖事上的差異，所要求的不僅是神學研究，也需要祈禱、愛德，以及真誠渴望發現那已在基督內賜給我們的合一。", "s203": "聖神使被釘死而又復活的基督在聖餐的晚餐中真實地臨在於我們，實現了建立聖事之言中所包含的許諾。基督的臨在顯然是聖餐的中心，因此，建立聖事之言中所包含的許諾對這慶典是根本性的。然而，聖父才是聖餐事件的首要根源和最終圓滿。降生成人的天主子是這事件藉以完成並在其內完成的那一位，是它生活的中心。聖神是使它成為可能、並繼續使它有效的無可測度的愛的力量。聖餐慶典與三位一體天主之奧蹟的聯繫，揭示了聖神的角色：祂是使耶穌歷史上的言語成為臨在而生活的那一位。教會因耶穌在建立聖事之言中的許諾而確信必蒙應允，便向聖父祈求聖神的恩賜，好使聖餐事件成為實在：被釘死而又復活的基督真實的臨在，祂為全人類捨棄自己的生命。這並不是把基督在聖餐中的臨在靈性化，而是肯定聖子與聖神之間不可分解的結合。這一結合清楚表明，聖餐不是一個魔術性或機械性的行動，而是一個向聖父所發出的祈禱，強調教會完全的依賴。在禮儀中，建立聖事之言、基督的許諾，與呼求聖神（epiclesis）之間，存在著內在的關係。在各種禮儀傳統中，呼求聖神相對於建立聖事之言的位置有所不同。在早期的禮儀中，整個「祈禱行動」被視為帶來基督所許諾的實在。呼求聖神既是為團體，也是為餅酒這些禮品而作的。恢復這樣的理解，或許能幫助我們克服有關某一特定祝聖時刻的困難。[61]", "s205": "聖體聖事是三位一體天主的工程：在其中，聖父賜予，聖子自我交付，聖神使這奧蹟在教會內臨在而生活。因此，基督在聖體聖事中的真實臨在，不能與聖神的行動分開；是聖神使教會與被釘死而又復活的主結合。感恩祭不是魔術性或機械性的行動，而是教會完全依賴天主的祈禱。不同的禮儀傳統可能以不同的方式表達建立聖事之言與呼求聖神之間的關係，但這些差異可以成為更深神學理解的契機，而不是共融的障礙。當教會圍繞聖體奧蹟聚集祈禱時，她藉著聖神的德能領受基督，並被更深地引入聖父的生命之中，成為一個在信仰、敬禮和愛中合一的民族。", "s207": "正是憑藉基督生活的言語，並藉著聖神的德能，餅和酒成為基督身體和血的聖事性記號。為了領受共融，它們始終保持如此。在教會的歷史中，曾有各種嘗試去理解基督在聖餐中真實而獨特之臨在的奧蹟。有些人只滿足於肯定這臨在，而不尋求解釋它。另一些人則認為必須肯定由聖神和基督的言語所帶來的一種轉變，其結果是：不再只是普通的餅和酒，而是基督的身體和血。還有一些人發展出一種對真實臨在的解釋，雖不聲稱窮盡這奧蹟的意義，卻設法保護它免受有害的詮釋。[62]", "s209": "聖體聖事始終是基督生活臨在的深奧奧蹟，是藉著祂的言語和聖神的德能而實現的。在整個基督宗教歷史中，各教會尋求不同的方式來表達和理解這奧蹟：有些強調基督臨在的真實性，而不試圖界定其方式；另一些則發展出神學解釋，以維護並闡明這一真實。這些差異提醒我們，基督臨在的奧蹟無法被人的語言完全涵蓋。因此，大公對話召叫基督徒區分奧蹟本身與用來解釋它的特定神學語言。各教會能以謙遜和敬畏彼此學習，同時忠於這一信念：基督在聖體聖事中真實地把自己賜給祂的子民。", "s211": "聖餐的整個行動具有「呼求聖神」（epikletic）的特質，因為它依賴聖神的工作。在禮儀的言詞中，聖餐的這一層面有多樣的表達。[63]", "s213": "聖神在整個感恩祭中工作，使教會意識到聖體聖事是天主的工程，而不只是人的行動。藉著呼求聖神，教會為了基督許諾的實現及祂子民的聖化而完全依賴天主。雖然不同的禮儀傳統以各種方式表達呼求聖神，但它們都提醒我們聖神在聖體奧蹟中主動的臨在。因此，聖體聖事召叫教會對聖神的推動保持開放；聖神不斷地使基督的身體合一、聖化並更新。", "s215": "教會作為新約的團體，滿懷信心地呼求聖神，好使她得到聖化與更新，被引入一切正義、真理與合一之中，並獲得力量完成她在世界上的使命。[64]", "s217": "聖神不僅使聖體奧蹟臨在，祂也更新舉行這奧蹟的教會。作為新約的團體，教會始終依賴聖神引領她走向正義、真理與合一。因此，聖體聖事成為整個基督徒團體更新的泉源，堅固其成員忠信地生活，並完成他們在世界上的使命。呼求聖神，也就是接受一份責任：容許祂轉化我們的關係、治癒分裂，並引導我們走向更深的共融。一個被聖神更新的教會，成為一個能夠藉著愛、服務、正義與合一為基督作證的教會。", "s219": "聖神藉著聖餐使人預嘗天主的國：教會領受新創造的生命，以及主必再來的保證。[65]", "s221": "藉著聖體聖事，聖神使我們預嘗天主的國，並以基督再來的希望更新我們。它提醒我們，我們已經是新創造的分享者，蒙召在對其圓滿的期待中生活。", "s223": "與滋養教會生命的基督在聖餐中的共融，同時也是在基督的身體——即教會——之內的共融。在某一地方分享同一個餅和共同的杯，彰顯並影響著分享者與基督、以及與各時各地之同分享者的合一。正是在聖餐中，天主子民的團體得以完全彰顯。聖餐慶典總是與整個教會相關，而整個教會也參與每一個地方的聖餐慶典。一個教會既然聲稱自己是整個教會的彰顯，就會留意以顧及其他教會之利益與關切的方式來安排自己的生活。自最早的日子以來，洗禮就被理解為使信者被納入基督身體並被賦予聖神的聖事。只要受洗信者及其職務人員在某一教會中參與並主持聖餐慶典的權利，仍受到主持其他聖餐會眾並身為其成員之人的質疑，聖餐的大公性便較不彰顯。今日許多教會正在討論是否讓受洗的兒童作為領受者參與主的晚餐。[66]", "s225": "聖體聖事彰顯基督身體的合一，使信者不僅與基督結合，也跨越時間、地域和傳統而彼此結合。因此，聖體共融召叫各教會彼此承認為同一身體的肢體，並重視所有受洗基督徒的尊嚴與參與。當分裂使基督徒無法完全分享聖體聖事時，教會的至公性便較不明顯地表達出來。因此，聖體聖事挑戰我們尋求更深的共融、相互的承認，以及在基督內的合一。", "s227": "聖餐涵蓋生活的所有層面。它是代表整個世界所作的感恩與奉獻的行動。聖餐慶典要求在所有被視為天主唯一家庭中的弟兄姊妹之間，實行修和與分享，並在社會、經濟和政治生活中尋求適當關係時，構成持續的挑戰（瑪5:23等；格前10:16等；格前11:20-22；迦3:28）。當我們分享基督的身體和血時，各種不義、種族主義、隔離和缺乏自由，都受到根本的挑戰。藉著聖餐，天主那更新一切的恩寵滲透並恢復人的位格與尊嚴。聖餐使信者參與世界歷史的核心事件。因此，作為聖餐的參與者，我們若不積極參與這持續中的對世界處境和人類境況的恢復，就顯得自相矛盾。聖餐向我們顯示，面對天主在人類歷史中修和的臨在，我們的行為是自相矛盾的：我們不斷處於審判之下，因為我們的社會中各種不義的關係持續存在，因為由人的驕傲、物質利益和權力政治所造成的種種分裂，尤其是因為在基督的身體內，那無可辯解的宗派對立頑固地存在。[67]", "s229": "聖體聖事召叫我們，把在基督內所領受的共融延伸到人類生活的每一個層面。分享基督唯一的身體，就是挑戰不義、種族主義、分裂，以及一切建立在驕傲、權力或排斥之上的關係。我們不能一面對他人的苦難與尊嚴漠不關心，一面又圓滿地舉行感恩祭。因此，聖體聖事的恩寵派遣我們進入世界，作修和、正義與和平的僕人，一同努力修復人際關係，並為基督所祈求的合一作證。", "s231": "在基督身體的聖餐共融中的休戚與共，以及基督徒對彼此和對世界負責任的關懷，在禮儀中得到具體的表達：在相互寬恕罪過中；在平安禮中；在為眾人的轉求中；在一同吃喝中；在把餅酒送給病人和獄中的人，或與他們一同舉行聖餐中。聖餐中愛的這一切表現，都直接關係到基督自己作為僕人的見證，而基督徒本身也參與祂的僕人身分。正如天主在基督內進入了人類的處境，同樣，聖餐禮儀也貼近男男女女具體而特殊的處境。在初期教會中，執事和女執事的職務以特殊的方式表達了聖餐的這一層面。這種介於聖桌與貧困者之間的職務，恰當地為基督在世界上救贖的臨在作證。[68]", "s233": "聖體聖事召叫基督徒藉著具體的愛與服務行動，使共融有形可見。寬恕、平安、轉求、分享，以及對病人、囚犯和貧困者的關懷，都顯示出基督自己那顆僕人之心的愛。因此，那些在聖體的餐桌前領受基督的人，被派遣去服務他人，尤其是那些受苦和被遺忘的人。當與基督的共融引領我們與弱小者共融，並負責任地關懷世界時，聖體聖事才真正具有轉化的力量。", "s235": "聖餐開啟了對天主統治的願景——這統治已被許諾為受造界最終的更新——而聖餐正是它的預嘗。凡是天主的恩寵顯明、人們為正義、仁愛與和平而努力的地方，這更新的記號便臨在於世界上。聖餐是一個筵席，教會在其中為這些記號感謝天主，並喜樂地慶祝和預嘗天國在基督內的來臨（格前11:26；瑪26:29）。[69]", "s237": "聖體聖事使教會預嘗天主的國；在那國裡，受造界將在正義、仁愛與和平中得到更新。世上每一個恩寵、慈悲和正義的行動，都成為這即將來臨之國的記號。當我們舉行感恩祭時，我們為這些記號感恩，並被堅固，得以參與天主持續不斷的更新工程。因此，聖體聖事塑造我們，使我們在希望中生活，同時積極地為天國在世界上的實現而努力。", "s239": "那被許諾要得到更新的世界，臨在於整個聖餐慶典之中。世界臨在於向聖父的感恩中，在那裡，教會代表整個受造界發言；臨在於基督的紀念中，在那裡，教會與她偉大的大司祭和轉求者結合，為世界祈禱；臨在於祈求聖神恩賜的祈禱中，在那裡，教會祈求聖化與新創造。[70]", "s241": "聖體聖事在教會的祈禱中擁抱整個世界。在感恩、紀念和呼求聖神中，教會把受造界和人類帶到聖父面前，祈求世界得到聖化和更新。因此，聖體共融不能與對整個人類大家庭的關懷分開。當我們舉行感恩祭時，我們蒙召成為天主更新之恩寵的工具，藉著祈禱、愛和服務，把基督的希望帶入世界。", "s243": "在聖餐中得到修和的基督身體的肢體，蒙召在男男女女之間作修和的僕人，並作復活之喜樂的見證人。正如耶穌在世職務期間走向稅吏和罪人，與他們同桌共餐，同樣，基督徒在聖餐中蒙召與被遺棄者休戚與共，並成為基督之愛的記號——祂為眾人而生活並犧牲自己，如今又在聖餐中把自己賜下。[71]", "s245": "聖體聖事派遣我們越過祭台，去作修和的僕人和復活喜樂的見證人。正如基督在世生活時歡迎罪人和邊緣人來到祂的餐桌，我們也蒙召去接觸那些被排斥、被遺忘或受傷的人。我們與基督的共融，必須成為與他人的休戚與共，尤其是與那些渴望被接納、渴望尊嚴的人。如此，聖體聖事成為基督之愛的生活表達，召叫我們把從祂那裡所領受的修和與新生命，與世界分享。", "s247": "聖餐的舉行本身，就是教會參與天主對世界之使命的一個實例。這種參與在日常生活中的形式是：宣講福音、服務近人，以及忠信地臨在於世界之中。[72]", "s249": "聖體聖事把教會派遣到天主的使命之中。我們在祭台上所慶祝的，必須藉著宣講福音、服務近人以及忠信地臨在於世界，在我們的日常生活中顯明出來。因此，與基督的共融成為一個召喚，要我們參與祂的使命，並把祂的愛帶入平凡的人類處境之中。聖體聖事塑造我們，不僅作為敬禮者，也作為基督的見證人和僕人。", "s251": "聖餐既然完全是天主的恩賜，便把一個新的實在帶入現世，這實在把基督徒轉化為基督的肖像，因而使他們成為祂有效的見證人。聖餐是傳教士寶貴的食糧，是在宗徒旅程上的朝聖者的餅與酒。聖餐團體得到滋養和堅固，以言語和行動宣認主耶穌基督——祂為世界的救恩捨棄了自己的生命。聖餐的集會既然在分享唯一之主的晚餐時成為一個民族，就必須關心把那些目前在其有形界限之外的人也聚集進來，因為基督邀請了祂為之而死的所有人來赴祂的筵席。只要基督徒無法在完全的團契中圍繞同一張桌子，吃同一個餅，喝同一個杯，他們的傳教見證在個人和團體兩個層面上都會被削弱。[73]", "s253": "所有基督徒都被邀請在基督內尋求更圓滿的合一。然而，在天主教會內領受聖體，須遵循教會的聖事紀律以及法典所規定的條件。如同朝聖者領受路上的食糧，我們被堅固，不僅以言語，也以被基督的愛和自我交付所塑造的生命來宣講福音。聖體團體也蒙召越過自己有形的界限，去歡迎所有基督邀請到祂餐桌前的人。人人都可自由參與聖體共融。當基督徒仍然分裂、無法完全分享唯一的聖體團契時，教會對基督身體之合一的見證便被削弱。因此，聖體共融挑戰我們在基督徒之間尋求更深的修和，好使我們共同的使命能更忠實地宣告那位為眾人的救恩而交付自己的唯一的主。", "s255": "聖餐禮儀本質上是一個單一的整體，歷史上由以下要素構成，其順序各異，重要性亦不同：− 讚美詩；− 懺悔禮；− 宣告赦免；− 以各種形式宣讀天主的聖言；− 宣認信仰（信經）；− 為整個教會和世界轉求；− 預備餅和酒；− 為創造、救贖和聖化的奇妙化工向聖父感恩（源自猶太傳統的berakah）；− 按照新約傳統，基督建立這件聖事的言語；− 紀念（anamnesis），即紀念救贖的偉大作為：受難、死亡、復活、升天及五旬節，這些作為使教會得以誕生；− 為團體及餅酒這些禮品呼求聖神（epiklesis）（或在建立聖事之言之前，或在紀念之後，或兩者兼有；或以某種其他提及聖神的方式，充分表達聖餐「呼求聖神」的特質）；− 把信友奉獻給天主；− 提及諸聖相通；− 祈求主的再來及祂國度最終的顯現；− 全體團體的「阿們」；− 天主經；− 修和與平安的記號；− 擘餅；− 在與基督及教會每一位成員的共融中吃喝；− 最後的讚美；− 祝福與派遣。[74]", "s257": "感恩祭禮儀把基督信仰的整個奧蹟匯集在一個敬禮行動之中。從懺悔和宣讀聖言，到感恩、紀念（anamnesis）、呼求聖神（epiclesis）、共融以及最後的派遣，每一個要素都引領教會更深地與基督並彼此共融。因此，感恩祭不只是一系列分開的禮節的集合，而是一個讚美、紀念、共融與使命的神聖行進。信友在餐桌前領受了基督之後，便蒙受祝福，被派遣到世界上，繼續祂愛、修和與服務的工作。", "s259": "在聖餐的慶祝和共融上邁向合一的最佳途徑，是各教會在教導和禮儀方面更新聖餐本身。各教會應當在目前正在達成的聖餐共識之光照下，檢驗自己的禮儀。禮儀改革運動已使各教會在舉行主的晚餐的方式上更加接近。然而，某種與我們共同的聖餐信仰相容的禮儀多樣性，被公認為一個健康而豐富的事實。肯定共同的聖餐信仰，並不意味著禮儀或實踐上的劃一。自新約時代起，教會就極為重視繼續使用耶穌在最後晚餐時所使用的餅和酒這些元素。在世界上某些地區，餅和酒並不常見或無法取得，現在有時有人主張，當地的食物和飲料更能使聖餐紮根於日常生活之中。哪些主的晚餐的特點是耶穌所建立而不可改變的，哪些特點仍屬於教會有權決定的範圍，這一問題需要進一步研究。[75]", "s261": "聖體的合一並不要求每個教會都以同樣的方式舉行感恩祭。所需要的，是對聖體奧蹟的共同信仰，透過可以保留正當文化及傳統多樣性的禮儀表達出來。因此，更新應引領各教會走向更深的共融，而不要求劃一。聖體聖事能夠成為一個交會點：各教會在其中認出彼此所共有的，以尊重的態度檢視那些仍使她們分裂的，並繼續一同分辨：基督的建立如何在不同的處境中被忠實地表達出來。", "s263": "在舉行聖餐時，基督聚集、教導並滋養教會。是基督邀請人赴宴，也是祂主持這晚餐。祂是帶領天主子民的牧者，是宣告天主聖言的先知，是舉行天主奧蹟的司祭。在大多數教會中，這種主持是由一位受過按立的職務人員來標示的。以基督之名主持聖餐慶典的人清楚表明：這禮儀不是會眾自己的創作或所有物；聖餐是從生活在祂教會內的基督那裡領受的恩賜。聖餐的施行人是代表天主主動的使者，並表達地方團體與普世教會中其他地方團體之間的聯繫。[76]", "s265": "基督始終是感恩祭真正的主持者，祂聚集、教導並滋養祂的教會。就天主教會而言，領受聖秩的職務人員是一個有形可見的記號，表明聖體聖事是基督的恩賜，而不是某一特定會眾的所有物。唯有有效領受聖秩的主教或司鐸，才能有效地祝聖聖體；司鐸是以元首基督的身分行事。藉著這職務，地方的聖體團體也被提醒：它屬於教會更廣大的共融。因此，主持感恩祭既表達與基督的共融，也表達各教會之間的共融，顯示聖體聖事屬於基督的整個身體。", "s267": "基督徒的信仰藉著舉行主的晚餐而得到加深。因此，聖餐應當經常舉行。神學、禮儀和實踐上的許多差異，都與舉行聖餐的不同頻率有關。[77]", "s269": "經常舉行感恩祭，不斷堅固教會的信仰與共融。它提醒基督徒：主的晚餐不是偶一為之的熱心敬禮，而是基督徒生活不可或缺的泉源。雖然各教會舉行的頻率不同，但這些差異能成為一個契機，讓人更深地反省聖體聖事在整個教會生活中的核心地位。", "s271": "既然聖餐慶祝基督的復活，它至少每個主日都應舉行，是適宜的。既然它是天主子民新的聖事性晚餐，就應鼓勵每一位基督徒經常領受共融。[78]", "s273": "主日感恩祭把基督徒聚集在基督復活的奧蹟周圍，並更新他們作為天主唯一子民的身分。經常參與領聖體，滋養我們的信仰，堅固我們與基督的共融，並加深我們彼此之間的共融。因此，定期舉行感恩祭，在信仰與使命的旅程中扶持教會。鼓勵那些已妥善準備且符合領受資格的天主教徒經常領聖體。", "s275": "有些教會強調，基督在已祝聖的餅酒中的臨在，在禮儀結束後仍然持續。另一些教會則把重點主要放在舉行的行動本身，以及在領受共融時食用餅酒。處理餅酒的方式需要特別留意。關於保存餅酒的做法，每個教會都應尊重其他教會的做法與虔敬。鑑於各教會在實踐上的多樣性，同時考慮到匯合進程的現狀，值得提出以下建議：− 一方面，應當記住（尤其在講道和教導中），保存餅酒的首要用意是分送給病人和缺席的人；− 另一方面，應當承認，對聖餐慶典中所分送的餅酒表示尊重的最佳方式，就是食用它們，但不排除用來為病人送聖體。[79]", "s277": "只要聖形仍然存在，基督就真實地、實體地臨在於已祝聖的聖形之下；因此，在彌撒之外保存並朝拜聖體是適宜的。因此，基督徒應以尊重和理解，而不是以評斷，來面對這些差異。保存聖體長久以來服務於牧靈的目的，就是把聖體送給病人、年長者以及無法參與禮儀的人。同時，信友應當認識到，聖體聖事在聚集的團體參與這聖事性晚餐時，得到最圓滿的表達。對這些做法的相互尊重，能幫助基督徒欣賞不同傳統的豐富，同時在對基督於聖體聖事中之恩賜的崇敬上保持合一。", "s279": "本聲明所表達的日益增進的相互理解，或許能使某些教會在彼此之間達到更大程度的聖餐共融，從而使基督那分裂的子民在主的餐桌周圍重新有形可見地合一的日子更加臨近。[80]", "s281": "基督徒之間的相互理解，能夠成為一條通往更深聖體共融的道路。隨著各教會持續彼此聆聽、研究彼此的差異，並承認她們已經共有的信仰，那使她們分離的分裂便可能逐漸讓位給更大的共融。基督徒的希望不只是更好地彼此理解，而是最終在主唯一的餐桌周圍重新有形可見地合一。這樣的合一將成為一個有力的見證，見證基督祈求祂所有門徒都合而為一的祈禱。對話、共同祈禱與匯合，本身並不建立完全的教會共融、聖事的有效性，或不受限制的共融聖餐。天主教在聖事上的分享，有經過仔細界定的情況與條件。", "s283": "論職務", "s285": "在一個破碎的世界中，天主召叫全人類成為天主的子民。為此，天主揀選了以色列，然後在耶穌基督——天主子——身上，以獨特而決定性的方式發言。耶穌把整個人類的本性、境況和事業當作祂自己的，把自己作為祭品為眾人獻上。耶穌服務的一生、祂的死亡和復活，是一個新團體的基礎；這團體不斷藉著福音的喜訊和聖事的恩賜而得到建立。聖神把那些跟隨耶穌基督的人結合在一個身體內，並派遣他們作為見證人進入世界。屬於教會，意味著藉著耶穌基督在聖神內與天主共融地生活。[81]", "s287": "教會是天主對破碎人類的回應，藉著耶穌基督和聖神的德能被聚集成為一個民族。基督的生活、服務、死亡和復活奠定了這新團體的基礎，而福音和聖事則不斷滋養它的生命。因此，屬於教會，就是藉著基督在聖神內與天主並彼此共融地生活。這共融從來不應只是向內封閉的；那使教會合一的同一位聖神，也派遣她的成員進入世界，作基督的見證人。因此，教會既是一個共融的團體，也是一個使命的團體，蒙召使天主要把人類聚集成為一個民族的願望有形可見。", "s289": "教會的生活建基於基督已一次而永遠完成的、對邪惡與死亡權勢的勝利。基督賜予寬恕，邀請人悔改，並把人從毀滅中拯救出來。藉著基督，人們得以轉向天主讚美祂，並轉向近人服務他們。在基督內，他們找到在自由、相互寬恕和愛中之新生命的泉源。藉著基督，他們的心思意念被引向天國的圓滿完成；在那裡，基督的勝利將要顯明，萬物都將更新。天主的旨意是：在耶穌基督內，所有的人都應分享這團契。[82]", "s291": "教會因基督戰勝罪惡、邪惡和死亡的勝利而生活。藉著祂，信者領受寬恕和新生命，並蒙召以悔改、讚美、服務和愛作出回應。這共融不只是一種靈性上的聯繫，而是一種生活方式：基督徒在走向天主國之圓滿的旅途中，彼此寬恕並服務近人。既然天主願意所有的人都分享這團契，教會便不斷受到挑戰，要克服分裂，成為在基督內所建立之新人類的有形可見的記號。", "s293": "教會藉著聖神那解放與更新的德能而生活。聖神臨於耶穌身上，這在祂的洗禮中得到證明；復活之後，同一位聖神被賜給那些相信復活之主的人，把他們重新創造為基督的身體。聖神召叫人們歸向信仰，藉著許多恩賜聖化他們，賜給他們為福音作證的力量，並使他們能夠在希望和愛中服務。儘管教會的成員軟弱，聖神仍保守教會於真理之中，並引導她。[83]", "s295": "聖神不斷更新教會，並賦予基督的身體生命。藉著聖神，信者蒙召歸向信仰，被多樣的恩賜所聖化，被堅固以宣講福音，並被賦予能力在愛與希望中服務。儘管教會成員有軟弱和局限，聖神仍保守教會於真理之中。因此，教會的合一與使命並不單單依靠人的力量，而是依靠那不斷聚集、聖化、引導天主子民並派遣他們進入世界的聖神。", "s297": "教會蒙召宣告並預示天主的國。教會藉著向世界宣講福音，並藉著她作為基督身體的存在本身，來完成這項使命。在耶穌內，天主的國來到了我們中間。祂把救恩賜給罪人。祂向貧窮的人傳報喜訊，向俘虜宣告釋放，向瞎子宣告復明，使受壓迫者獲得自由（路4:18）。基督建立了通往聖父的新途徑。在這與天主的共融中生活，教會的所有成員都蒙召宣認他們的信仰，並說明他們的希望。他們在設法以關懷的愛作見證時，要與所有人的喜樂和痛苦認同。基督身體的成員要與受壓迫者一同奮鬥，邁向隨天國來臨而被許諾的自由與尊嚴。這項使命需要在不同的政治、社會和文化處境中執行。為了忠實地完成這項使命，他們將在每一種處境中尋求相應的見證與服務形式。如此，他們便把天主國之喜樂與光榮的預嘗帶給世界。[84]", "s299": "教會蒙召不僅要宣告天主的國，也要藉著基督身體的生活使天國的臨在有形可見。跟隨耶穌，教會必須向貧窮的人傳報喜訊，與受壓迫者站在一起，並捍衛每一個人的尊嚴與自由。因此，她的使命藉著信德、慈悲、正義和服務，成為天主國具體的見證。當基督徒與人類的喜樂和痛苦認同時，他們便成為天國之希望與光榮的記號——這天國已經臨在於基督內，並等待著它的圓滿。", "s301": "聖神把多樣而互補的恩賜賜給團體。這些恩賜是為了全體子民的公益，並在團體內以及對世界的服務行動中顯示出來。它們可以是以言以行傳達福音的恩賜、治病的恩賜、祈禱的恩賜、教導與學習的恩賜、服務的恩賜、帶領與跟隨的恩賜、啟發與遠見的恩賜。所有成員都蒙召在團體的幫助下，發現自己所領受的恩賜，並運用這些恩賜來建設教會，並服務教會被派遣前往的世界。[85]", "s303": "聖神以多樣的恩賜裝備整個教會，為了一個共同的使命。沒有任何恩賜只是為了個人的益處；每一項恩賜都是為了建設團體和服務世界而賜下的。因此，當每一位成員都發現、發展並忠實地運用聖神所託付的恩賜時，教會便會更加堅強。恩賜的多樣性不必造成分裂；當這些恩賜在服務基督和公益中結合起來時，反而能成為共融的泉源。如此，教會成為一個生活的身體，在其中，每一位成員在天主的使命中都有一個位置、一個聖召和一份責任。", "s305": "雖然各教會在對天主子民之召叫的一般理解上意見一致，但她們在教會生活應如何安排的理解上卻有分歧。特別是在按立職務的地位和形式方面存在差異。在努力克服這些差異時，各教會需要從整個天主子民之召叫的角度出發。必須為以下問題找到一個共同的答案：按照天主的旨意，在聖神的引導下，教會的生活應如何被理解和安排，好使福音得以傳播，團體在愛中得到建設？[86]", "s307": "教會的不同傳統既顯示出一個共同的召叫，也顯示出對於這召叫應如何安排的不同理解。因此，職務的問題不應僅被當作各種教會結構之間的競爭來處理，而應被視為對聖神願意教會如何生活和服務的共同分辨。每一種形式的職務都應有助於宣講福音、建設基督徒團體以及愛的增長。當各教會越過其體制上的差異，一同探問她們的結構如何能更好地服務基督唯一的使命時，大公對話便能結出果實。", "s309": "在聖神德能中生活的團體，將以各種神恩為其特徵。聖神是多樣恩賜的賜予者，這些恩賜豐富了團體的生活。為了提升這些神恩的效能，團體將公開承認其中某些神恩。其中有些服務於團體生活中的長久需要，另一些則是暫時的。修會團體中的男女，履行一項對教會生活特別重要的服務。按立的職務本身就是一種神恩，絕不可成為這些神恩之多樣性的障礙。相反，它將幫助團體發現聖神賜給它的恩賜，並裝備身體的肢體以多種方式服務。[87]", "s311": "聖神藉著多樣的神恩豐富教會，這些神恩不僅是為了特定的時刻而賜下，也是為了團體持續的需要。聖事性的聖職是聖神的聖統性恩賜，藉聖秩聖事而授予，有別於普通司祭職，也有別於個人的神恩。神恩性的職務很有價值，但必須在教會共融中加以分辨，因此應當服務、承認並堅固整個天主子民中所存在的恩賜。當職務幫助團體分辨其恩賜，並裝備其成員去服務，而不是成為他們參與的障礙時，職務便能結出果實。因此，一個健康的教會不是以職務取代信友神恩的教會，而是聖職與聖神的多樣恩賜一同合作，為建設基督的身體及其在世界上之使命的教會。", "s313": "在教會的歷史中，曾有一些時期，福音的真理只能藉著先知性和神恩性的領袖才得以保存。新的推動力往往只能以不尋常的方式進入教會的生活。有時，改革需要一種特殊的職務。按立的職務人員和整個團體，都需要留意這類特殊職務所帶來的挑戰。[88]", "s315": "教會的歷史顯示，當福音需要更新、糾正或更深的忠信時，聖神能夠興起先知性和神恩性的聲音。這類職務可能出現在一般的結構之外，卻能成為工具，使教會藉此重新發現她聖召中被忽略的層面。因此，聖職以及更廣大的團體需要一種分辨的精神——既不因為不熟悉就排斥不尋常的恩賜，也不毫無批判地接受每一項主張。真正的教會分辨會探問：某一特定的職務是否保存福音、堅固共融，並引領教會更忠實地進入她的使命。如此，先知性的職務與聖職不必彼此競爭；兩者都能成為唯一聖神的工具，祂不斷更新基督的身體。", "s317": "宗徒們作為基督生活與復活的見證人，並由祂所派遣，是福音的原始傳遞者，也是耶穌基督救恩之言與行之傳統的原始傳遞者，而這些言與行構成了教會的生命。這宗徒傳統延續於歷史之中，並把教會與她在基督內、在宗徒團內的起源連結起來。在這宗徒傳統之內，有一個職務的宗徒傳承，它服務於教會在基督內之生活的連續性，以及她對宗徒們所傳遞的耶穌之言與行的忠信。由宗徒們所委任的職務人員，以及後來各教會的監督（episkopoi），是這宗徒傳統之傳遞的最初守護者；他們為職務的宗徒傳承作證，這傳承藉著初期教會的主教，在基督徒團體內與長老和執事的集體共融中得以延續。因此，應當區分整個教會的宗徒傳統與宗徒職務的傳承。[89]", "s319": "教會的宗徒性，藉著福音以及由宗徒傳下來之信仰的持續傳遞而得以保存。宗徒傳統屬於整個教會，而嚴格意義上的職務性宗徒傳承，則是藉著聖秩聖事傳遞給與伯多祿繼承人共融的主教們。這一區分使教會能夠珍視職務中的連續性與多樣性，而不把宗徒性僅僅化約為體制上的傳承。當教會的各種職務服務於生活的宗徒信仰、保存福音，並堅固整個天主子民之間的共融時，教會便始終忠於基督。", "s321": "結論", "s323": "從教會的孕育之初，合一就非常重要。聖洗聖事、聖體聖事，以及職務的確定性本質，在教會的生活中至關重要。但隨著時間的推移，由於對聖經的不同詮釋及對其訊息的不同理解，分裂帶來了種種變化。另一個因素是當時社會的性質。也曾發生過一些歷史上的積怨。聖事大公主義的目標，是容納不同的理解，並在聖經的光照下使它們進入對話，好使各教會能夠找到服務基督教會之合一的途徑。天主教會不是普世教會協會的成員，而是一位積極的觀察者。天主教會可以透過觀察和審慎的分辨，向BEM學習。雖然天主教會不是普世教會協會的成員，但自1968年以來，天主教神學家已全面參與其信仰與教制委員會，包括參與BEM等匯合文本的工作。BEM並不是天主教訓導權的聲明。", "s325": "聖體聖事既揭示了恩賜，也揭示了基督徒分裂的創傷，因為在擘開的餅中，基督徒認出基督的臨在，同時渴望共同共融的圓滿。聖事大公主義始於對那已臨在於其他基督徒敬禮中之基督的崇敬，並承認恩寵先於體制上的修和。天主教的教導承認，凡是保存了有效聖秩聖事及宗徒傳承之處，便有有效的聖體聖事，尤其是在東方教會中。聖事是相遇，而非擁有之物；它們揭示天主的主動，要越過歷史的分裂，把人類聚集到修和之中。擘開的餅成為一個先知性的記號，提醒基督徒：分裂違背了他們所慶祝的奧蹟本身。", "s327": "聖事生活邀請信者走向皈依；在其中，參與基督的奧蹟把排斥的態度轉化為款待與修和的實踐。共同的渴望能夠滋養已經存在的不完全共融，但這並不構成完全的聖體分享。聖事的想像力在聖言、服務、祈禱和團體中認出臨在的基督，為更深的教會修和預備人心。聖事大公主義並不使教義相對化，而是把神學對話置於活生生的相遇之中，在那裡，愛德與真理一同前進。聖事大公主義的終極視野是唯一的聖體餐桌；在那裡，已經修和的基督徒慶祝基督為祂的教會早已願意的合一。新興的「共融：合一與正義倡議」（Koinonia: Unity and Justice Initiative，KUJI）認為，BEM文件（尤其是本文所引用的訓示）值得在其與不同教會進行對話與合作的大公旅程中加以推廣。作為其創辦人，BEM將成為KUJI的基礎文件之一，用於其推動基督徒合一的大公事業之中。"}}, "title": {"en": "On Sacramental Ecumenism: Encountering Christ in the Broken Bread of Christian Unity", "zh": "論聖事大公主義：在基督徒合一的擘開之餅中與基督相遇"}, "types": [["s003", "abstract"], ["s005", "keywords"], ["s011", "title"], ["s015", "h"], ["s017", "p"], ["s019", "p"], ["s021", "h"], ["s023", "p"], ["s025", "p"], ["s027", "p"], ["s029", "p"], ["s031", "h"], ["s033", "p"], ["s035", "h"], ["s037", "p"], ["s039", "p"], ["s041", "cite"], ["s043", "p"], ["s045", "cite"], ["s047", "p"], ["s049", "cite"], ["s051", "p"], ["s053", "cite"], ["s055", "p"], ["s057", "cite"], ["s059", "p"], ["s061", "cite"], ["s063", "p"], ["s065", "cite"], ["s067", "p"], ["s069", "cite"], ["s071", "p"], ["s073", "cite"], ["s075", "p"], ["s077", "cite"], ["s079", "p"], ["s081", "cite"], ["s083", "p"], ["s085", "cite"], ["s087", "p"], ["s089", "cite"], ["s091", "p"], ["s093", "cite"], ["s095", "p"], ["s097", "cite"], ["s099", "p"], ["s101", "cite"], ["s103", "p"], ["s105", "cite"], ["s107", "p"], ["s109", "cite"], ["s111", "p"], ["s113", "cite"], ["s115", "p"], ["s117", "cite"], ["s119", "p"], ["s121", "cite"], ["s123", "p"], ["s125", "cite"], ["s127", "p"], ["s129", "cite"], ["s131", "p"], ["s133", "cite"], ["s135", "p"], ["s137", "cite"], ["s139", "p"], ["s141", "cite"], ["s143", "p"], ["s145", "h"], ["s147", "cite"], ["s149", "p"], ["s151", "cite"], ["s153", "p"], ["s155", "cite"], ["s157", "p"], ["s159", "cite"], ["s161", "p"], ["s163", "cite"], ["s165", "p"], ["s167", "cite"], ["s169", "p"], ["s171", "cite"], ["s173", "p"], ["s175", "cite"], ["s177", "p"], ["s179", "cite"], ["s181", "p"], ["s183", "cite"], ["s185", "p"], ["s187", "cite"], ["s189", "p"], ["s191", "cite"], ["s193", "p"], ["s195", "cite"], ["s197", "p"], ["s199", "cite"], ["s201", "p"], ["s203", "cite"], ["s205", "p"], ["s207", "cite"], ["s209", "p"], ["s211", "cite"], ["s213", "p"], ["s215", "cite"], ["s217", "p"], ["s219", "cite"], ["s221", "p"], ["s223", "cite"], ["s225", "p"], ["s227", "cite"], ["s229", "p"], ["s231", "cite"], ["s233", "p"], ["s235", "cite"], ["s237", "p"], ["s239", "cite"], ["s241", "p"], ["s243", "cite"], ["s245", "p"], ["s247", "cite"], ["s249", "p"], ["s251", "cite"], ["s253" <script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const ALIAS = {zh:'zh','zh-tw':'zh','zh-hant':'zh',tw:'zh','zh-hk':'zh',hk:'zh',cn:'zh','zh-cn':'zh',en:'en','en-us':'en','en-gb':'en'};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;)])/g,'<a href="$1" rel="noopener" target="_blank">$1</a>');
const fnify = (s, seen) => esc(s).replace(/\[(\d+)\]/g,(m,n)=>{ const id = seen[n] ? '' : ' id="ref-'+n+'"'; seen[n]=1; return '<sup class="fn"><a href="#fn-'+n+'"'+id+' aria-label="note '+n+'">'+n+'</a></sup>'; });
function pick(){ const q = new URLSearchParams(location.search).get('lang'); return ALIAS[(q||'').toLowerCase()] || 'en'; }
function fig(id, L){ const im = D.imgs[id]; if(!im) return ''; return '<figure><img src="'+im.src+'" width="'+im.w+'" height="'+im.h+'" alt="'+esc(D.ui[L]['alt_'+id]||'')+'"></figure>'; }
function render(L){
  const U = D.ui[L], T = D.text[L];
  document.documentElement.lang = L==='zh' ? 'zh-Hant' : 'en';
  document.title = (L==='zh' ? D.title.zh + ' · ' + D.title.en : D.title.en + ' · ' + D.title.zh);
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===L));
  const rv = '<strong>'+esc(U.review_notice)+'</strong><small>'+esc(U.review_small)+'</small>';
  document.getElementById('banner').innerHTML = rv;
  document.getElementById('kicker').textContent = U.initiative.split('（')[0];
  document.getElementById('title').textContent = D.title[L];
  document.getElementById('byline').innerHTML = esc(U.by)+' <b>'+esc(U.author_name)+'</b>';
  document.getElementById('langbar').setAttribute('aria-label', U.language);
  const seen = {}; let h = ''; let toc = []; let bemShown = false;
  // cover image after byline
  for (const k in D.imgs) if (D.imgs[k].after==='byline') h += fig(k, L);
  for (const [id, type] of D.types){
    const t = T[id];
    if (type==='title') continue;
    if (type==='abstract'){ h += '<section class="abstract"><h2>'+esc(U.abstract)+'</h2><p>'+fnify(t,seen)+'</p>'; continue; }
    if (type==='keywords'){ h += '<p class="kw"><b>'+esc(U.keywords)+':</b> '+esc(t)+'</p></section>'; h += '<!--TOC-->'; continue; }
    if (type==='h'){ toc.push([id,t]); h += '<h2 class="sec" id="'+id+'">'+esc(t)+'</h2>'; if (id==='s031' && !bemShown){ h += '<p class="bemnote">'+esc(U.bem_note)+'</p>'; bemShown = true; } }
    else if (type==='cite'){ h += '<div class="cite"><span class="lab">'+esc(U.cited_label)+'</span><p>'+fnify(t,seen)+'</p></div>'; }
    else { h += '<p>'+fnify(t,seen)+'</p>'; }
    for (const k in D.imgs) if (D.imgs[k].after===id) h += fig(k, L);
  }
  const tocH = '<nav class="toc" aria-label="'+esc(U.contents)+'"><b>'+esc(U.contents)+'</b><ol>'+toc.map(([i,t])=>'<li><a href="#'+i+'">'+esc(t)+'</a></li>').join('')+'</ol></nav>';
  h = h.replace('<!--TOC-->', tocH);
  // notice before notes
  h += '<div class="notice"><p><strong>'+esc(U.review_notice)+'</strong></p><p class="s">'+esc(U.review_small)+'</p>'+(L!=='en' ? '<p class="s">'+esc(U.translation_note)+'</p>' : '')+'</div>';
  const fnKeys = Object.keys(D.footnotes).sort((a,b)=>a-b);
  h += '<details class="fns" id="notes"><summary>'+esc(U.footnotes)+' ('+fnKeys.length+')</summary><p class="orig">'+esc(U.references_note)+'</p><ol class="fnlist">'+fnKeys.map(n=>'<li id="fn-'+n+'" value="'+n+'">'+linkify(D.footnotes[n])+' <a class="back" href="#ref-'+n+'" aria-label="back">↩</a></li>').join('')+'</ol></details>';
  h += '<details class="bib"><summary>'+esc(U.references)+'</summary><ul class="biblist">'+D.bib.map(b=>'<li>'+linkify(b)+'</li>').join('')+'</ul></details>';
  document.getElementById('main').innerHTML = h;
  const hero = D.imgs['10'];
  document.getElementById('closing').innerHTML = (hero ? '<img class="hero" src="'+hero.src+'" alt="'+esc(U.alt_10)+'">' : '') +
    '<div class="inner"><h3>'+esc(D.title[L])+'</h3><p>'+esc(U.author_name)+' · '+esc(U.initiative)+'</p><p><strong>'+esc(U.read_full)+'</strong></p>' +
    '<div class="links"><a href="?lang=zh" data-l="zh" lang="zh-Hant">中文</a><a href="?lang=en" data-l="en" lang="en">English</a></div></div>';
  const hasImg = Object.keys(D.imgs).length > 0;
  document.getElementById('footer').innerHTML = '<p><strong>'+esc(U.review_notice)+'</strong></p><p>'+esc(U.review_small)+'</p>' +
    (L!=='en' ? '<p>'+esc(U.translation_note)+'</p>' : '') + (hasImg ? '<p>'+esc(U.illustration_credit)+'</p>' : '') +
    '<p>'+esc(U.purpose)+' · '+esc(U.share)+': <a href="'+D.base+'?lang='+L+'">'+D.base.replace('https://','')+'?lang='+L+'</a></p>' +
    '<p>© '+esc(U.author_name)+' · '+esc(U.initiative)+'</p>';
  document.getElementById('toplink').setAttribute('aria-label', U.back_to_top);
  document.getElementById('toplink').title = U.back_to_top;
}
function go(L, push){ render(L); if (push){ const u = new URL(location.href); u.searchParams.set('lang', L); history.pushState({L}, '', u); } }
document.addEventListener('click', e => {
  const c = e.target.closest('.chip, .closing .links a'); if (c){ e.preventDefault(); go(c.dataset.l, true); window.scrollTo({top:0}); return; }
  const f = e.target.closest('sup.fn a'); if (f){ document.getElementById('notes').open = true; }
});
window.addEventListener('popstate', () => render(pick()));
window.addEventListener('hashchange', () => { if (location.hash.startsWith('#fn-')) document.getElementById('notes').open = true; });
render(pick());
if (location.hash.startsWith('#fn-')) document.getElementById('notes').open = true;
})();
</script>
